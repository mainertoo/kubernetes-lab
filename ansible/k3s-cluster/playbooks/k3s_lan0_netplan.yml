---
# Bring the second-NIC (lan0 / Default LAN) netplan under Ansible.
#
# Run with:
#   ansible-playbook -i ansible/k3s-cluster/inventory/production/dynamic.sh \
#     ansible/k3s-cluster/playbooks/k3s_lan0_netplan.yml
#
# ⚠️ This playbook deliberately keeps `accept-ra: true`. It briefly pinned RA
# off (2026-08-12) as defence-in-depth against the SLAAC ULA that broke the
# kubelet scrape targets — that was a mistake. The Default LAN's RA is the
# nodes' only IPv6 default route, and Home Assistant / matter-server (both
# hostNetwork) need it to reach Matter devices on the IoT VLAN at fd00:20::/64.
# Turning it off took the living-room Matter dimmer offline. See the template
# header for the full rationale and the symptom to recognise.
#
# The kubelet problem is solved by pinning node-ip in k3s_node_config.yml, which
# is independent of RA — run that one first and the nodes can safely carry their
# ULAs. In the reverse order, removing an address kubelet still has configured
# as a secondary node IP wedges its node-status updates; see
# templates/k3s_node_ip.yaml.j2.
#
# Only hosts listed in the cluster's `lan0_addresses` map are touched;
# everything else ends early. Staging has no second-NIC nodes, so this is a
# no-op there.
#
# SAFETY: lan0 carries NFS (192.168.1.252) for the media PVs. The play refuses
# to rewrite netplan unless the address in group_vars matches what is already
# live on the interface, so a wrong or stale map fails loudly instead of
# silently renumbering a node off its storage. Override with
# `-e lan0_force_address=true` only when you are deliberately renumbering.
# Ansible reaches these hosts over eth0 (cluster VLAN), so a lan0 misstep
# does not cost us the connection we would need to fix it.

- name: Manage the lan0 (Default LAN) netplan on K3s nodes
  hosts: k3s_cluster
  become: yes
  serial: 1
  max_fail_percentage: 0
  vars:
    lan0_address: "{{ (lan0_addresses | default({}))[inventory_hostname] | default('') }}"
  tasks:
    - name: Skip nodes with no lan0 address defined for this cluster
      ansible.builtin.meta: end_host
      when: lan0_address | length == 0

    - name: Read the live lan0 IPv4 address
      ansible.builtin.command: ip -4 -o addr show dev lan0
      register: lan0_live
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Assert lan0 exists and is addressed on this host
      ansible.builtin.assert:
        that:
          - lan0_live.rc == 0
          - lan0_live.stdout | trim | length > 0
        fail_msg: >-
          lan0_addresses lists {{ inventory_hostname }} but this host has no
          addressed lan0 interface. Either the map is wrong or the NIC/cloud-init
          naming changed — fix that before letting Ansible write netplan.

    - name: Assert the templated address matches what is live on lan0
      vars:
        lan0_live_cidr: >-
          {{ lan0_live.stdout | regex_search('inet (\S+)', '\1') | first }}
      ansible.builtin.assert:
        that:
          - lan0_live_cidr | trim == lan0_address
        fail_msg: >-
          Refusing to rewrite netplan on {{ inventory_hostname }}: group_vars
          says {{ lan0_address }} but lan0 currently holds
          {{ lan0_live_cidr | trim }}. Reconcile lan0_addresses with reality, or
          pass -e lan0_force_address=true if you really are renumbering this node.
      when: not (lan0_force_address | default(false) | bool)

    - name: "Write the lan0 netplan (address + accept-ra off)"
      ansible.builtin.template:
        src: templates/netplan_lan0.yaml.j2
        dest: /etc/netplan/60-lan0-iot.yaml
        owner: root
        group: root
        # netplan warns loudly about world-readable configs; match the 0600
        # the hand-written file already carried.
        mode: "0600"
      notify: Apply netplan

    - name: Validate the netplan configuration parses before applying
      ansible.builtin.command: netplan generate
      changed_when: false

    - name: Apply pending handlers before moving to the next node
      ansible.builtin.meta: flush_handlers

    - name: Verify lan0 kept its IPv4 address
      ansible.builtin.command: ip -4 -o addr show dev lan0
      register: lan0_after
      changed_when: false
      check_mode: false
      retries: 6
      delay: 3
      until: lan0_after.stdout is search('inet ' ~ (lan0_address | regex_escape))

    - name: Wait for the RA-assigned IPv6 address and default route on lan0
      # These are REQUIRED, not incidental: the RA-provided default route is the
      # node's only path to Matter devices on the IoT VLAN (fd00:20::/64), which
      # Home Assistant / matter-server reach over hostNetwork. Losing it takes
      # every off-link Matter device offline. Safe to carry the ULA because
      # k3s_node_config.yml pins node-ip, so kubelet ignores it.
      ansible.builtin.shell: |
        set -o pipefail
        echo "addr=$(ip -6 -o addr show dev lan0 scope global | wc -l) route=$(ip -6 route show default dev lan0 | wc -l)"
      args:
        executable: /bin/bash
      register: lan0_v6
      changed_when: false
      check_mode: false
      retries: 10
      delay: 6
      until: lan0_v6.stdout is search('addr=[1-9]') and lan0_v6.stdout is search('route=[1-9]')

    - name: Report the IPv6 state Matter depends on
      ansible.builtin.debug:
        msg: >-
          lan0 on {{ inventory_hostname }} has its RA-assigned global IPv6 and a
          default route ({{ lan0_v6.stdout | trim }}) — Matter devices on
          fd00:20::/64 are reachable from this node.

  handlers:
    - name: Apply netplan
      ansible.builtin.command: netplan apply
