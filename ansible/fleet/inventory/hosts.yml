---
# Fleet inventory for OS patching (Proxmox hosts, K3s VMs, LXCs, standalone VMs).
#
# Host order inside each group IS the rollout order — the playbooks run
# serial: 1 in inventory order, so keep the sequencing rationale below intact
# when adding hosts.
#
# PVE hosts and pbs/zwave-js/spark are reached through the operator's
# ~/.ssh/config aliases. No credentials live in this repo — see README § Secrets.
all:
  children:

    # ── Proxmox VE hosts ────────────────────────────────────────────────
    # Order follows Ceph's upgrade order: mon/mgr/OSD hosts first (one at a
    # time), then the MDS-only hosts, then the client-only backup host. Each
    # reboot restarts that host's Ceph daemons on the newly installed version.
    # pve-mammoth goes first on 2026-09-14: the QNAP firmware update wedged its
    # NFS client (stale tank/shared-nfs), which only a reboot clears.
    pve:
      vars:
        ansible_user: root
      hosts:
        pve-mammoth:
          ceph_roles: [mon, mgr, osd, mds]
          i915_sriov_dkms_version: "2026.08.12.1"
          k3s_guests:
            - { vmid: 661, node: mainertoo-k3s-master-1, context: production }
            - { vmid: 664, node: mainertoo-k3s-worker-1, context: production }
            - { vmid: 671, node: staging-k3s-master-1, context: staging }
        pve-zermatt:
          ceph_roles: [mon, mgr, osd, mds]
          i915_sriov_dkms_version: "2026.08.12.1"
          k3s_guests:
            - { vmid: 663, node: mainertoo-k3s-master-3, context: production }
            - { vmid: 666, node: mainertoo-k3s-worker-3, context: production }
            - { vmid: 673, node: staging-k3s-worker-2, context: staging }
        pve-whistler:
          ceph_roles: [mon, mgr, osd, mds]
          i915_sriov_dkms_version: "2026.08.12.1"
          # CPU defect on P-core 2 — isolcpus comes from /etc/default/grub.d/cpu-debug.cfg.
          expect_cmdline: "isolcpus=4,5"
          k3s_guests:
            - { vmid: 662, node: mainertoo-k3s-master-2, context: production }
            - { vmid: 665, node: mainertoo-k3s-worker-2, context: production }
            - { vmid: 672, node: staging-k3s-worker-1, context: staging }
        pve-mac:
          ceph_roles: [mds]
          k3s_guests: []
        pve-s13:
          ceph_roles: [mds]
          # 7 iGPU VFs enabled (none passed through today); its old 2026.05.06 driver
          # can't build for kernel 7.0.14-17 and would fail the apt upgrade.
          i915_sriov_dkms_version: "2026.08.12.1"
          k3s_guests: []
          # Ceph public net rides a USB NIC on vmbr9; a cold boot once came up portless.
          # The NIC is read from the bridge's bridge-ports at runtime.
          ceph_bridge: vmbr9
        pve-ugreen:
          ceph_roles: []
          k3s_guests: []
          # Same iGPU family as s13 (Alder Lake-N), kept VF-ready as a GPU fallback
          # host. SR-IOV cmdline + sysfs.conf were already set, but its 2025.07.22
          # driver stopped building at kernel 6.17, so it booted stock i915 with 0 VFs.
          i915_sriov_dkms_version: "2026.08.12.1"
          i915_sriov_vfs: 7
          # No kernel pin here; the ZFS module must exist for the kernel it will boot.
          zfs_pool: zbackup
          cephfs_mounts: [/mnt/pve/cephfs-k3s, /mnt/pve/cephfs-swarm]
          # Nightly RBD export to /zbackup — never reboot mid-run.
          busy_process: rbd-nightly-backup.sh

    # ── K3s VMs (Ubuntu) ────────────────────────────────────────────────
    k3s:
      vars:
        ansible_user: ubuntu
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_k3s
      children:
        k3s_staging:
          vars:
            kube_context: staging
          hosts:
            staging-k3s-master-1: { ansible_host: 192.168.90.167, vmid: 671, pve_host: pve-mammoth, k3s_role: server }
            staging-k3s-worker-2: { ansible_host: 192.168.90.169, vmid: 673, pve_host: pve-zermatt, k3s_role: agent }
            staging-k3s-worker-1: { ansible_host: 192.168.90.168, vmid: 672, pve_host: pve-whistler, k3s_role: agent }
        k3s_production:
          vars:
            kube_context: production
          # Workers first: a bad OS upgrade there costs capacity, not etcd quorum.
          hosts:
            mainertoo-k3s-worker-1: { ansible_host: 192.168.90.164, vmid: 664, pve_host: pve-mammoth, k3s_role: agent, lan0_address: 192.168.1.246 }
            mainertoo-k3s-worker-2: { ansible_host: 192.168.90.165, vmid: 665, pve_host: pve-whistler, k3s_role: agent, lan0_address: 192.168.1.247 }
            mainertoo-k3s-worker-3: { ansible_host: 192.168.90.166, vmid: 666, pve_host: pve-zermatt, k3s_role: agent, lan0_address: 192.168.1.248 }
            mainertoo-k3s-master-1: { ansible_host: 192.168.90.161, vmid: 661, pve_host: pve-mammoth, k3s_role: server }
            mainertoo-k3s-master-2: { ansible_host: 192.168.90.162, vmid: 662, pve_host: pve-whistler, k3s_role: server }
            mainertoo-k3s-master-3: { ansible_host: 192.168.90.163, vmid: 663, pve_host: pve-zermatt, k3s_role: server }

    # ── LXC containers (patched via `pct exec` on their PVE host) ───────
    # Secondaries before primaries so DNS / subnet routing never loses both.
    lxc:
      vars:
        ansible_connection: local
      hosts:
        ct105-adguard-ugreen: { pve_host: pve-ugreen, ctid: 105, health: tcp53 }
        ct106-tailscale-ugreen: { pve_host: pve-ugreen, ctid: 106, health: tailscale }
        ct104-adguard: { pve_host: pve-mac, ctid: 104, health: tcp53 }
        ct110-debian-tailscale: { pve_host: pve-mac, ctid: 110, health: tailscale }
        ct100-plex: { pve_host: pve-s13, ctid: 100, health: none }
        # kopia-lxc: skipped while a kopia snapshot is running (see lxc_patch.yml).
        ct111-kopia: { pve_host: pve-ugreen, ctid: 111, health: kopia }

    # ── Standalone VMs ──────────────────────────────────────────────────
    vms:
      children:
        vms_ssh:
          hosts:
            pbs: { ansible_user: root, busy_check: pbs_tasks }
        # No passwordless sudo — driven as root through the QEMU guest agent.
        vms_guest_agent:
          vars:
            ansible_connection: local
          hosts:
            zwave-js: { pve_host: pve-s13, vmid: 701, ensure_containers: [zwave-js-ui, portainer_agent] }
        # Needs an interactive sudo password: run with --limit spark -K.
        vms_manual_become:
          hosts:
            spark: { ansible_user: mainertoo }
