[defaults]
inventory = inventory/hosts.yml
forks = 10
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o ServerAliveCountMax=8
