[defaults]
inventory = inventory/hosts.yml
forks = 10
# Pinned, not auto-discovered: discovery binds a run to e.g. /usr/bin/python3.13,
# which do-release-upgrade purges — every later async poll then fails silently
# and the task hangs until its async timeout. /usr/bin/python3 survives upgrades.
interpreter_python = /usr/bin/python3
retry_files_enabled = False
callback_result_format = yaml
timeout = 30

[ssh_connection]
pipelining = True
# No ControlMaster multiplexing: do-release-upgrade and host reboots restart
# sshd, and a stale mux master silently stalled async polling for 25+ minutes.
# A fresh connection per task is slower but survives sshd restarts.
ssh_args = -o ControlMaster=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=20
