#!/usr/sbin/nft -f
# matter-server VM (VLAN 20 / IoT). Default-deny inbound. matter-server runs with
# network_mode: host, so its ports are governed by this INPUT chain (not Docker NAT).
# Replace only our own table — never "flush ruleset", which would also wipe
# the tables Docker installs (breaks container networking on an nftables restart).
table inet filter
delete table inet filter
table inet filter {
  set admin4     { type ipv4_addr; flags interval; elements = { 192.168.10.0/24, 192.168.1.0/24 } }
  set ha4        { type ipv4_addr; flags interval; elements = { 192.168.90.0/24 } }
  set portainer4 { type ipv4_addr; elements = { 192.168.1.252 } }
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    meta l4proto icmp accept
    meta l4proto ipv6-icmp accept
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept
    udp dport 5353 accept
    ip  saddr 192.168.20.0/24 udp dport 5540 accept
    ip6 saddr { fe80::/10, fd00::/8 } udp dport 5540 accept
    ip  saddr @ha4 tcp dport 5580 accept
    ip  saddr @admin4 tcp dport 22 accept
    ip  saddr @portainer4 tcp dport 9001 accept
  }
  chain forward { type filter hook forward priority 0; policy accept; }
  chain output  { type filter hook output priority 0; policy accept; }
}
