#!/usr/sbin/nft -f
# airconnect LXC (CT 703, VLAN 20 / IoT). Default-deny inbound.
table inet filter
delete table inet filter
table inet filter {
  set admin4   { type ipv4_addr; flags interval; elements = { 192.168.10.0/24, 192.168.1.0/24 } }
  # AirPlay senders: Trusted (phones/Macs) + Management (admin box).
  set senders4 { type ipv4_addr; flags interval; elements = { 192.168.10.0/24, 192.168.1.0/24 } }
  set fans4    { type ipv4_addr; elements = { 192.168.20.70, 192.168.20.247 } }
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    meta l4proto icmp accept
    meta l4proto ipv6-icmp accept
    udp sport 547 udp dport 546 accept
    # mDNS: airupnp advertises _raop._tcp; the UniFi reflector relays it to Trusted.
    udp dport 5353 accept
    # SSDP: M-SEARCH replies are unicast to our ephemeral port, so conntrack never matches
    # them (the request went to 239.255.255.250) — and the fans' MUZO stack replies from an
    # ephemeral source port, not :1900. So admit any UDP from the fans, plus NOTIFY on :1900.
    ip saddr @fans4 meta l4proto udp accept
    ip saddr 192.168.20.0/24 udp dport 1900 accept
    # Fans: GENA event callbacks (libupnp binds 49152 or the next free port — it was 49153
    # in practice) and pulling the audio stream over HTTP.
    ip saddr @fans4 tcp dport { 49152-49159, 49200-49239 } accept
    # AirPlay 1 from senders: RTSP (tcp) + RTP audio/control/timing (udp).
    ip saddr @senders4 meta l4proto { tcp, udp } th dport 49200-49239 accept
    ip saddr @admin4 tcp dport 22 accept
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  { type filter hook output priority 0; policy accept; }
}
