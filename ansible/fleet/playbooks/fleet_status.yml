---
# Read-only update report for the whole fleet. Safe to run any time.
#
#   cd ansible/fleet && ansible-playbook playbooks/fleet_status.yml
#
# One line per host: OS, running kernel, uptime, last upgrade, pending /
# security / kernel packages, reboot needed, package-list age, kernel pin.
#
# It also posts a summary to Discord when `vars/notify.sops.yaml` exists
# (key: discord_webhook_url). Skip that with -e notify=false, or override the
# target with -e discord_webhook_url=...  Run it monthly to catch drift before
# it is weeks deep.

- name: Probe hosts reachable over SSH
  hosts: pve:k3s:vms_ssh
  gather_facts: false
  tasks:
    - name: Run the probe
      ansible.builtin.script: ../files/probe.sh
      register: probe
      changed_when: false

    - name: Keep the line for the summary
      ansible.builtin.set_fact:
        fleet_line: "{{ probe.stdout | trim }}"

    - name: Report
      ansible.builtin.debug:
        msg: "{{ fleet_line }}"

- name: Probe LXC containers via their PVE host
  hosts: lxc
  gather_facts: false
  tasks:
    - name: Stage the probe on the PVE host
      ansible.builtin.copy:
        src: ../files/probe.sh
        dest: /tmp/fleet-probe.sh
        mode: "0755"
      delegate_to: "{{ pve_host }}"

    - name: Run the probe inside the container
      ansible.builtin.shell: pct exec {{ ctid }} -- sh -s < /tmp/fleet-probe.sh
      delegate_to: "{{ pve_host }}"
      register: probe
      changed_when: false

    - name: Keep the line for the summary
      ansible.builtin.set_fact:
        fleet_line: "{{ probe.stdout | trim }}"

    - name: Report
      ansible.builtin.debug:
        msg: "{{ fleet_line }}"

- name: Probe VMs via the QEMU guest agent
  hosts: vms_guest_agent
  gather_facts: false
  tasks:
    - name: Stage the probe on the PVE host
      ansible.builtin.copy:
        src: ../files/probe.sh
        dest: /tmp/fleet-probe.sh
        mode: "0755"
      delegate_to: "{{ pve_host }}"

    - name: Run the probe inside the VM
      ansible.builtin.shell: qm guest exec {{ vmid }} --pass-stdin 1 --timeout 60 -- sh -s < /tmp/fleet-probe.sh
      delegate_to: "{{ pve_host }}"
      register: probe
      changed_when: false

    - name: Keep the line for the summary
      ansible.builtin.set_fact:
        fleet_line: "{{ (probe.stdout | from_json)['out-data'] | default('') | trim }}"

    - name: Report
      ansible.builtin.debug:
        msg: "{{ fleet_line }}"

# Summary to Discord (#homelab-updates). Optional: without a webhook the
# summary is still printed, so the playbook stays useful and never fails on
# the notification.
- name: Post the fleet summary to Discord
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    notify: true
    notify_secrets: "{{ playbook_dir }}/../vars/notify.sops.yaml"
  tasks:
    # Namespaced under `fleet_notify` and read from ansible_facts explicitly:
    # top-level fact injection (INJECT_FACTS_AS_VARS) is deprecated.
    - name: Load the webhook from SOPS (if present)
      community.sops.load_vars:
        file: "{{ notify_secrets }}"
        name: fleet_notify
      when:
        - discord_webhook_url is not defined
        - notify | bool
        - notify_secrets is exists

    - name: Resolve the webhook (-e discord_webhook_url=... wins)
      ansible.builtin.set_fact:
        webhook_url: >-
          {{ discord_webhook_url | default(ansible_facts.fleet_notify.discord_webhook_url | default('')) }}

    - name: Build the summary
      ansible.builtin.command: python3 {{ playbook_dir }}/../files/fleet_report.py
      args:
        stdin: "{{ groups['all'] | map('extract', hostvars, 'fleet_line') | select('defined') | select('truthy') | join('\n') }}"
      register: fleet_report
      changed_when: false

    - name: Summary
      ansible.builtin.debug:
        msg: "{{ fleet_report.stderr_lines }}"

    - name: Send it to Discord
      ansible.builtin.uri:
        url: "{{ webhook_url }}"
        method: POST
        body: "{{ fleet_report.stdout }}"
        body_format: json
        status_code: [200, 204]
      when:
        - notify | bool
        - webhook_url | length > 0
      no_log: true

    - name: No webhook configured
      ansible.builtin.debug:
        msg: >-
          Not posting to Discord: create ansible/fleet/vars/notify.sops.yaml with
          `discord_webhook_url`, or pass -e discord_webhook_url=... (-e notify=false to silence this).
      when:
        - notify | bool
        - webhook_url | length == 0
