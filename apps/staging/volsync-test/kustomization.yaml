---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volsync-test
  namespace: flux-system
spec:
  interval: 1h
  path: ./apps/base/volsync-test
  # No targetNamespace: every object sets its own namespace.
  dependsOn:
    - name: infra-controllers
    - name: infra-kopiur-config

  prune: true
  retryInterval: 2m
  timeout: 10m
  wait: false

  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
