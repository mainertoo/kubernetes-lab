apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: layerling
resources:
  - layerling-namespace.yaml
  - layerling-secret.sops.yaml
  - layerling-pvc.yaml
  - layerling-release.yaml
  - layerling-ingressroute.yaml

# Hash suffix ON so editing the wrapper rolls the pod; kustomizeconfig.yaml
# rewrites the HelmRelease's persistence name to the suffixed ConfigMap.
configMapGenerator:
  - name: layerling-mcp-http
    files:
      - mcp-http/mcp-http.mjs

configurations:
  - kustomizeconfig.yaml
