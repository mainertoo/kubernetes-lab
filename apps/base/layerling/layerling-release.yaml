apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: layerling
  namespace: layerling
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  maxHistory: 2

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  uninstall:
    keepHistory: false

  values:
    controllers:
      layerling:
        containers:
          app:
            image: &image
              repository: henmedia/layerling
              tag: 1.179.0@sha256:381bfcfabaeebbc4b1452985895010be935b69fcc5392da40527e1aa30177d75
            env:
              - name: TZ
                value: America/Los_Angeles
              - name: NEXT_TELEMETRY_DISABLED
                value: "1"
              # Designs saved here are .lyl files (groups, sketches, undo history)
              # on the backed-up PVC instead of browser storage.
              - name: LAYERLING_SHARED_PROJECTS_DIR
                value: /shared-projects
              - name: LAYERLING_NEW_DESIGNS_ON_SERVER
                value: "always"
              # MCP relay: the `mcp` sidecar (and any legacy local bridge)
              # drives open editor tabs. LAYERLING_MCP_TOKEN from layerling-secret.
              - name: LAYERLING_MCP_REMOTE
                value: "true"
              - name: LAYERLING_MCP_ALLOWED_HOSTS
                value: layerling.lab.mainertoo.com
            envFrom:
              - secretRef:
                  name: layerling-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
          # Remote MCP: upstream's stdio bridge behind a tiny Streamable-HTTP
          # wrapper (mcp-http/mcp-http.mjs), so any MCP client reaches
          # https://layerling.lab.mainertoo.com/mcp with the bearer token — no
          # local bridge checkout. Same image as the app: the wrapper reads
          # /app/package.json and fetches the bridge at that exact tag, so
          # Renovate bumps move app + bridge together.
          mcp:
            image: *image
            command: ["node", "/mcp-http/mcp-http.mjs"]
            env:
              - name: TZ
                value: America/Los_Angeles
              - name: MCP_HTTP_PORT
                value: "3100"
              - name: APP_URL
                value: http://127.0.0.1:3000
              # export_mesh outputPath (relative) lands on the backed-up PVC,
              # in a dot-folder the shared-projects list doesn't show.
              - name: BRIDGE_CWD
                value: /shared-projects/.mcp-exports
            envFrom:
              - secretRef:
                  name: layerling-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3100
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              # Never gate the editor's readiness on the MCP sidecar.
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        pod:
          securityContext:
            # Image runs as nextjs (999:999); fsGroup lets it write the PVC root.
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch

    service:
      layerling:
        controller: layerling
        ports:
          http:
            port: 3000
          mcp:
            port: 3100

    persistence:
      projects:
        existingClaim: layerling-projects
        globalMounts:
          - path: /shared-projects
      mcp-http:
        type: configMap
        name: layerling-mcp-http
        advancedMounts:
          layerling:
            mcp:
              - path: /mcp-http
                readOnly: true
