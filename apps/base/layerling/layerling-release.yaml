apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: layerling
  namespace: layerling
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  maxHistory: 2

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  uninstall:
    keepHistory: false

  values:
    controllers:
      layerling:
        containers:
          app:
            image:
              repository: henmedia/layerling
              tag: 1.117.2@sha256:be0f43a7fc4a5a76e29d547d7b383d350b416ee989fd2c51a2fb0efb409d2393
            env:
              - name: TZ
                value: America/Los_Angeles
              - name: NEXT_TELEMETRY_DISABLED
                value: "1"
              # Designs saved here are .lyl files (groups, sketches, undo history)
              # on the backed-up PVC instead of browser storage.
              - name: LAYERLING_SHARED_PROJECTS_DIR
                value: /shared-projects
              - name: LAYERLING_NEW_DESIGNS_ON_SERVER
                value: "always"
              # MCP bridge: AI client on the Mac drives open editor tabs.
              # LAYERLING_MCP_TOKEN comes from layerling-secret.
              - name: LAYERLING_MCP_REMOTE
                value: "true"
              - name: LAYERLING_MCP_ALLOWED_HOSTS
                value: layerling.lab.mainertoo.com
            envFrom:
              - secretRef:
                  name: layerling-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
        pod:
          securityContext:
            # Image runs as nextjs (999:999); fsGroup lets it write the PVC root.
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch

    service:
      layerling:
        controller: layerling
        ports:
          http:
            port: 3000

    persistence:
      projects:
        existingClaim: layerling-projects
        globalMounts:
          - path: /shared-projects
