apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
  namespace: karakeep
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  maxHistory: 2

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  uninstall:
    keepHistory: false

  values:
    controllers:
      # ── Web app (Next.js) — the only stateful, user-facing controller ──────
      web:
        strategy: Recreate # RWO /data PVC — avoid multi-attach on rollout
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.33.2
            env:
              - name: TZ
                value: America/Los_Angeles
              - name: DATA_DIR
                value: /data
              - name: NEXTAUTH_URL
                value: https://karakeep.lab.mainertoo.com
              - name: MEILI_ADDR
                value: http://karakeep-meilisearch:7700
              - name: BROWSER_WEB_URL
                value: http://karakeep-chrome:9222
              - name: DISABLE_NEW_RELEASE_CHECK
                value: "true"
              # ── Authentik native OIDC (login shows "Sign in with Authentik") ──
              - name: OAUTH_WELLKNOWN_URL
                value: https://authentik.lab.mainertoo.com/application/o/karakeep/.well-known/openid-configuration
              - name: OAUTH_PROVIDER_NAME
                value: Authentik
              - name: OAUTH_SCOPE
                value: openid email profile
              - name: OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING
                value: "true"
              # ── AI auto-tagging via the DGX Spark (Qwen, OpenAI-compatible) ──
              # Chat/tagging inference. Embeddings run on a SEPARATE Spark model
              # and port and are configured via the EMBEDDING_* block below --
              # Karakeep >=0.33 supports independent embedding overrides, which
              # is what unblocked semantic search here (0.32 had a single
              # OpenAI base URL, so embeddings had to stay off).
              - name: OPENAI_BASE_URL
                value: http://spark-llm.spark-egress.svc.cluster.local:8000/v1
              - name: INFERENCE_TEXT_MODEL
                value: nvidia/Qwen3.6-35B-A3B-NVFP4
              - name: INFERENCE_CONTEXT_LENGTH
                value: "32768"
              # Qwen3.6 is a REASONING model: it emits a large <think> block
              # before the answer. With too small an output budget the thinking
              # exhausts it and Karakeep gets empty content ("Got no message
              # content from OpenAI") → failed/retried tag jobs. Neither
              # reasoning_effort nor /no_think are honoured by this vLLM build,
              # and Karakeep can't send chat_template_kwargs:{enable_thinking:
              # false}, so the only reachable fix is a large output budget so
              # the reasoning always completes before emitting content.
              - name: INFERENCE_MAX_OUTPUT_TOKENS
                value: "24000"
              # ── Embeddings / semantic search (Karakeep >=0.33) ───────────────
              # Points at the Spark's SEPARATE embedding server (mxbai on :8081)
              # rather than the Qwen chat endpoint on :8000. Karakeep falls back
              # to the OPENAI_* pair for any EMBEDDING_* value left unset, so the
              # base URL MUST be given explicitly or embeddings would be sent to
              # the chat model and fail. EMBEDDING_OPENAI_API_KEY is intentionally
              # omitted -- it falls back to the dummy OPENAI_API_KEY, which
              # llama.cpp ignores.
              #
              # The vector store is Meilisearch itself (plugin "MeiliSearchVector"),
              # which requires meili >=1.13 -- satisfied by v1.52.0.
              #
              # ⚠️ BOTH numbers below MUST be set; Karakeep's defaults are wrong
              # for this model and the schema would silently accept them:
              #   EMBEDDING_DIMENSIONS     upstream default 1536, mxbai emits 1024
              #   EMBEDDING_CONTEXT_LENGTH upstream default 8000, mxbai's trained
              #                            window (n_ctx_train) is only 512
              # Verified against the live endpoint: a /v1/embeddings call returns
              # exactly 1024 floats. ⚠️ Changing the model or its dimensions after
              # even ONE bookmark is embedded forces a FULL regeneration of all
              # embeddings (Admin → Background Jobs → Embeddings).
              #
              # EMBEDDING_TEXT_MODEL_DIMENSION_OVERRIDE is deliberately NOT set:
              # it makes Karakeep send a `dimensions` request param, which this
              # llama.cpp build does not accept (mxbai is fixed at 1024 anyway).
              #
              # Auto-indexing must be explicit here. Upstream enables it by
              # default ONLY for a stock OpenAI setup -- the guard is
              # `!OLLAMA_BASE_URL && !OPENAI_BASE_URL && !!OPENAI_API_KEY`, and
              # OPENAI_BASE_URL is set above, so it would otherwise stay off.
              #
              # ⚠️ AUTO-INDEXING DOES NOT BACKFILL. It only enqueues work when a
              # bookmark is CREATED or UPDATED, so turning embeddings on does
              # nothing at all for bookmarks that already exist. Enabling this
              # (2026-08-10) therefore produced ZERO embeddings: the newest
              # bookmark here was created 2026-06-20 / modified 2026-07-13, so no
              # trigger event has occurred since. Diagnosed 2026-08-11 -- the
              # config, the Spark endpoint and the workers were all fine.
              #
              # A first-time enable needs the SAME one-time backfill as a model
              # change, and it takes TWO steps -- the second is easy to miss:
              #
              #   1. Admin → Background Jobs → "Regenerate Embeddings for All
              #      Bookmarks" (tRPC admin.regenerateAllBookmarkEmbeddings).
              #      This creates the bookmarks_vectors index, configures the
              #      embedder, and enqueues one job per bookmark.
              #   2. kubectl -n karakeep rollout restart deploy/karakeep-web
              #
              # ⚠️ Step 2 is REQUIRED on a first enable. The embeddings worker
              # binds its index at POD START. Step 1 is what creates
              # bookmarks_vectors, so any pod older than that click booted
              # against an index that did not exist and no-ops forever: the jobs
              # sit pending with numRunsLeft still at max (= never attempted),
              # and nothing errors. Same shape as the search-indexing worker in
              # the Meili fallback runbook below. After the restart the queue
              # drains immediately (292 bookmarks in ~9 min, 2026-08-12).
              #
              # This fails SILENTLY -- nothing errors, nothing retries, and
              # full-text search keeps working, so semantic search just quietly
              # returns weaker results.
              #
              # ⚠️ VECTORS LIVE IN A SEPARATE INDEX: `bookmarks_vectors`, NOT
              # `bookmarks`. Checking embedders on `bookmarks` returns `{}`
              # forever no matter how healthy things are -- a useless check.
              # Verify (needs MEILI_MASTER_KEY from karakeep-secret; both are on
              # the meili pod):
              #   curl -H "Authorization: Bearer $KEY" <meili>:7700/stats
              #     → indexes.bookmarks_vectors.numberOfEmbeddings must be > 0
              #       and should equal indexes.bookmarks.numberOfDocuments
              #   curl -H "Authorization: Bearer $KEY" \
              #        <meili>:7700/indexes/bookmarks_vectors/settings/embedders
              #     → {"default":{"source":"userProvided","dimensions":1024}}
              #       `{}` (or a 404 on the index) = the backfill never ran.
              # Distinguish "never ran" from "ran but stuck" via the job queue in
              # web:/data/queue.db -- 0 rows in `tasks` means step 1 was never
              # done; rows in queue 'embeddings_queue' pending at max
              # numRunsLeft means step 1 ran and you still owe step 2.
              - name: EMBEDDING_OPENAI_BASE_URL
                value: http://spark-embed.spark-egress.svc.cluster.local:8081/v1
              - name: EMBEDDING_TEXT_MODEL
                value: ChristianAzinn/mxbai-embed-large-v1-gguf:Q8_0
              - name: EMBEDDING_DIMENSIONS
                value: "1024"
              - name: EMBEDDING_CONTEXT_LENGTH
                value: "512"
              - name: EMBEDDING_ENABLE_AUTO_INDEXING
                value: "true"
            envFrom:
              # NEXTAUTH_SECRET, MEILI_MASTER_KEY, OAUTH_CLIENT_ID/SECRET,
              # OPENAI_API_KEY (dummy — vLLM ignores the value but needs presence)
              - secretRef:
                  name: karakeep-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 5
              startup:
                enabled: false

      # ── Headless Chrome — stateless crawler/screenshotter ─────────────────
      chrome:
        containers:
          app:
            image:
              # Zenika's GCR mirror (gcr.io/zenika-hub/alpine-chrome) stopped
              # serving anonymous pulls — its token endpoint returns 403 while
              # gcr.io/google-containers/pause still returns 200, so it is them,
              # not us. The image only kept working because it was cached on the
              # nodes; a container-image prune on 2026-08-12 removed the copies
              # and the pod went ImagePullBackOff.
              #
              # docker.io/zenika/alpine-chrome is the project's own Docker Hub
              # repo, public, multi-arch (linux/amd64 + linux/arm64), and still
              # publishing — 124 is its newest numeric tag, so Renovate keeps an
              # upgrade path. Same upstream project, different registry.
              repository: docker.io/zenika/alpine-chrome
              tag: "124"
            args:
              - --no-sandbox
              - --disable-gpu
              - --disable-dev-shm-usage
              - --remote-debugging-address=0.0.0.0
              - --remote-debugging-port=9222
              - --hide-scrollbars
              - --disable-blink-features=AutomationControlled
              - --window-size=1440,900
            probes:
              liveness: { enabled: false }
              readiness: { enabled: false }
              startup: { enabled: false }

      # ── Meilisearch — full-text index (reproducible from the DB; no backup) ─
      meilisearch:
        strategy: Recreate # RWO /meili_data PVC
        containers:
          app:
            image:
              repository: getmeili/meilisearch
              # Meili refuses to start on an index written by a different engine
              # version: "Your database version (x) is incompatible with your
              # current engine version (y)". Left alone, the bump crashloops,
              # Helm times out on Deployment/karakeep-meilisearch, rolls back,
              # and the HelmRelease ends Stalled=True/RetriesExceeded — which
              # does NOT retry on its own. Hit on v1.41→v1.49, v1.49→v1.52 and
              # v1.52→v1.53.
              #
              # MEILI_UPGRADE_DB below makes that migration automatic and
              # in-place, so ordinary Renovate bumps just work. See the env block
              # for the caveat. If it ever fails, fall back to the wipe runbook
              # at the bottom of this block.
              tag: v1.53.0
            env:
              - name: MEILI_NO_ANALYTICS
                value: "true"
              # Dumpless in-place DB migration on startup. Meili only acts on
              # this when the on-disk version actually differs, so it is a no-op
              # on a normal restart. Without it, every Meilisearch minor bump is
              # a manual index wipe + full reindex (see runbook below).
              #
              # Caveat: the migration is IRREVERSIBLE — once the DB is upgraded
              # you cannot roll the image back. That is acceptable here precisely
              # because this index is disposable: the karakeep-meilisearch PVC is
              # intentionally un-backed-up and the index rebuilds from the SQLite
              # DB in /data, so the worst case is the wipe runbook below.
              - name: MEILI_UPGRADE_DB
                value: "true"
              - name: MEILI_ENV
                value: production
              - name: MEILI_MASTER_KEY
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: MEILI_MASTER_KEY
            probes:
              liveness: { enabled: false }
              readiness: { enabled: false }
              startup: { enabled: false }
        # ── FALLBACK: manual index wipe + reindex ────────────────────────────
        # Only needed if MEILI_UPGRADE_DB above fails to migrate the DB (or for
        # an upgrade path Meili refuses to do in place). Validated v1.41→v1.49
        # 2026-07-13 and v1.49→v1.52 2026-08-09, i.e. before MEILI_UPGRADE_DB.
        #
        #   flux suspend hr karakeep -n karakeep        # stop Flux racing the wipe
        #   kubectl -n karakeep scale deploy/karakeep-meilisearch --replicas=0
        #   # wipe /meili_data via a busybox pod mounting the karakeep-meilisearch PVC
        #   flux resume hr karakeep -n karakeep
        #   flux reconcile hr karakeep -n karakeep --reset   # --reset clears Stalled
        #   kubectl -n karakeep rollout restart deploy/karakeep-web   # (1) see below
        #   # Karakeep Admin → "Reindex all bookmarks"
        #   kubectl -n karakeep rollout restart deploy/karakeep-web   # (2) see below
        #
        # Do NOT scale meili back to 1 by hand — the HR upgrade does it, and
        # brings the pod up on the NEW image against the empty index.
        #
        # BOTH web restarts are required, for DIFFERENT reasons, and each
        # failure mode is silent (reindex returns HTTP 200 either way):
        #  (1) BEFORE reindex: a web pod that predates the wipe holds a stale
        #      Meili client and indexes NOTHING.
        #  (2) AFTER reindex: the search-indexing worker initialises at pod
        #      start. The index does not exist until the reindex click
        #      recreates it, so a worker started before that no-ops and never
        #      drains the queue. Symptom: 292 rows in /data/queue.db queue
        #      'searching_indexing' stuck status=pending numRunsLeft=6
        #      (= never attempted), and no documentAdditionOrUpdate tasks in
        #      Meili's /tasks. The restart makes it drain in ~6 min.
        #
        # Verify either path (needs MEILI_MASTER_KEY from karakeep-secret):
        #   curl -H "Authorization: Bearer $KEY" <meili>:7700/stats
        # numberOfDocuments must match the pre-upgrade baseline (292 @ 2026-08-09).

    service:
      # Web service → Service resource "karakeep-app" (multi-service bjw-s names
      # each Service <release>-<key>). The IngressRoute targets karakeep-app.
      app:
        controller: web
        ports:
          http:
            port: 3000
      chrome:
        controller: chrome
        ports:
          http:
            port: 9222
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700

    persistence:
      data:
        existingClaim: karakeep-data
        advancedMounts:
          web:
            app:
              - path: /data
      meili-data:
        existingClaim: karakeep-meilisearch
        advancedMounts:
          meilisearch:
            app:
              - path: /meili_data
