apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
  namespace: karakeep
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  maxHistory: 2

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  uninstall:
    keepHistory: false

  values:
    controllers:
      # ── Web app (Next.js) — the only stateful, user-facing controller ──────
      web:
        strategy: Recreate # RWO /data PVC — avoid multi-attach on rollout
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.32.0
            env:
              - name: TZ
                value: America/Los_Angeles
              - name: DATA_DIR
                value: /data
              - name: NEXTAUTH_URL
                value: https://karakeep.lab.mainertoo.com
              - name: MEILI_ADDR
                value: http://karakeep-meilisearch:7700
              - name: BROWSER_WEB_URL
                value: http://karakeep-chrome:9222
              - name: DISABLE_NEW_RELEASE_CHECK
                value: "true"
              # ── Authentik native OIDC (login shows "Sign in with Authentik") ──
              - name: OAUTH_WELLKNOWN_URL
                value: https://authentik.lab.mainertoo.com/application/o/karakeep/.well-known/openid-configuration
              - name: OAUTH_PROVIDER_NAME
                value: Authentik
              - name: OAUTH_SCOPE
                value: openid email profile
              - name: OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING
                value: "true"
              # ── AI auto-tagging via the DGX Spark (Qwen, OpenAI-compatible) ──
              # Embeddings/semantic-search live on a separate Spark model+port;
              # Karakeep only supports one OpenAI base URL, so text auto-tagging
              # is wired here and embeddings are left off for now.
              - name: OPENAI_BASE_URL
                value: http://spark-llm.spark-egress.svc.cluster.local:8000/v1
              - name: INFERENCE_TEXT_MODEL
                value: nvidia/Qwen3.6-35B-A3B-NVFP4
              - name: INFERENCE_CONTEXT_LENGTH
                value: "32768"
              # Qwen3.6 is a REASONING model: it emits a large <think> block
              # before the answer. With too small an output budget the thinking
              # exhausts it and Karakeep gets empty content ("Got no message
              # content from OpenAI") → failed/retried tag jobs. Neither
              # reasoning_effort nor /no_think are honoured by this vLLM build,
              # and Karakeep can't send chat_template_kwargs:{enable_thinking:
              # false}, so the only reachable fix is a large output budget so
              # the reasoning always completes before emitting content.
              - name: INFERENCE_MAX_OUTPUT_TOKENS
                value: "24000"
            envFrom:
              # NEXTAUTH_SECRET, MEILI_MASTER_KEY, OAUTH_CLIENT_ID/SECRET,
              # OPENAI_API_KEY (dummy — vLLM ignores the value but needs presence)
              - secretRef:
                  name: karakeep-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 5
              startup:
                enabled: false

      # ── Headless Chrome — stateless crawler/screenshotter ─────────────────
      chrome:
        containers:
          app:
            image:
              repository: gcr.io/zenika-hub/alpine-chrome
              tag: "124"
            args:
              - --no-sandbox
              - --disable-gpu
              - --disable-dev-shm-usage
              - --remote-debugging-address=0.0.0.0
              - --remote-debugging-port=9222
              - --hide-scrollbars
              - --disable-blink-features=AutomationControlled
              - --window-size=1440,900
            probes:
              liveness: { enabled: false }
              readiness: { enabled: false }
              startup: { enabled: false }

      # ── Meilisearch — full-text index (reproducible from the DB; no backup) ─
      meilisearch:
        strategy: Recreate # RWO /meili_data PVC
        containers:
          app:
            image:
              repository: getmeili/meilisearch
              # A Meilisearch version bump REQUIRES a one-time index migration:
              # Meili refuses to start on an index written by a different engine
              # version (the v1.41→v1.49 update crashlooped "database version
              # (1.41.0) is incompatible with engine (1.49.0)" until /meili_data
              # was wiped). The karakeep-meilisearch PVC is intentionally
              # un-backed-up — the index rebuilds from the SQLite DB in /data,
              # so nothing is lost. Renovate flags these bumps with the
              # meili-index-migration label (see renovate.json) — it stays enabled.
              #
              # RUNBOOK (validated v1.41→v1.49 2026-07-13, v1.49→v1.52 2026-08-09).
              # The bump will have already FAILED by the time you run this: the
              # Helm upgrade times out on Deployment/karakeep-meilisearch
              # 'InProgress', rolls back, and leaves the HelmRelease
              # Stalled=True/RetriesExceeded — which does NOT retry on its own.
              #
              #   flux suspend hr karakeep -n karakeep        # stop Flux racing the wipe
              #   kubectl -n karakeep scale deploy/karakeep-meilisearch --replicas=0
              #   # wipe /meili_data via a busybox pod mounting the karakeep-meilisearch PVC
              #   flux resume hr karakeep -n karakeep
              #   flux reconcile hr karakeep -n karakeep --reset   # --reset clears Stalled
              #   kubectl -n karakeep rollout restart deploy/karakeep-web   # (1) see below
              #   # Karakeep Admin → "Reindex all bookmarks"
              #   kubectl -n karakeep rollout restart deploy/karakeep-web   # (2) see below
              #
              # Do NOT scale meili back to 1 by hand — the HR upgrade does it, and
              # brings the pod up on the NEW image against the empty index.
              #
              # BOTH web restarts are required, for DIFFERENT reasons, and each
              # failure mode is silent (reindex returns HTTP 200 either way):
              #  (1) BEFORE reindex: a web pod that predates the wipe holds a stale
              #      Meili client and indexes NOTHING.
              #  (2) AFTER reindex: the search-indexing worker initialises at pod
              #      start. The index does not exist until the reindex click
              #      recreates it, so a worker started before that no-ops and never
              #      drains the queue. Symptom: 292 rows in /data/queue.db queue
              #      'searching_indexing' stuck status=pending numRunsLeft=6
              #      (= never attempted), and no documentAdditionOrUpdate tasks in
              #      Meili's /tasks. The restart makes it drain in ~6 min.
              #
              # Verify (needs MEILI_MASTER_KEY from karakeep-secret):
              #   curl -H "Authorization: Bearer $KEY" <meili>:7700/stats
              # numberOfDocuments must match the pre-wipe baseline (292 @ 2026-08-09).
              tag: v1.52.0
            env:
              - name: MEILI_NO_ANALYTICS
                value: "true"
              - name: MEILI_ENV
                value: production
              - name: MEILI_MASTER_KEY
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: MEILI_MASTER_KEY
            probes:
              liveness: { enabled: false }
              readiness: { enabled: false }
              startup: { enabled: false }

    service:
      # Web service → Service resource "karakeep-app" (multi-service bjw-s names
      # each Service <release>-<key>). The IngressRoute targets karakeep-app.
      app:
        controller: web
        ports:
          http:
            port: 3000
      chrome:
        controller: chrome
        ports:
          http:
            port: 9222
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700

    persistence:
      data:
        existingClaim: karakeep-data
        advancedMounts:
          web:
            app:
              - path: /data
      meili-data:
        existingClaim: karakeep-meilisearch
        advancedMounts:
          meilisearch:
            app:
              - path: /meili_data
