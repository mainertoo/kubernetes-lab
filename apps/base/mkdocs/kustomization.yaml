apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mkdocs
resources:
  - mkdocs-namespace.yaml
  - mkdocs-git-secret.sops.yaml
  - mkdocs-content-pvc.yaml
  - mkdocs-nginx-configmap.yaml
  - mkdocs-release.yaml
  - mkdocs-ingressroute.yaml

# mkdocs.yml + the asset hook for the build container. No name hash: the
# HelmRelease references the ConfigMap by name, and the build loop notices
# content changes itself (it rebuilds when the config checksum changes).
configMapGenerator:
  - name: mkdocs-site-config
    files:
      - site-config/mkdocs.yml
      - site-config/stage_assets.py
generatorOptions:
  disableNameSuffixHash: true
