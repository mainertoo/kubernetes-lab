apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mkdocs
  namespace: mkdocs
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  maxHistory: 2

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  uninstall:
    keepHistory: false

  values:
    controllers:
      mkdocs:
        # Single RWO content PVC -> one replica.
        strategy: Recreate
        containers:
          # ---- git-sync: continuously mirror mainertoo/wiki (private) ----
          # Runs as root so openssh accepts the 0400 root-owned deploy key
          # (matches the in-cluster root pattern used by other apps).
          git-sync:
            image:
              repository: registry.k8s.io/git-sync/git-sync
              tag: v4.7.1
            env:
              GITSYNC_REPO: "git@github.com:mainertoo/wiki.git"
              GITSYNC_REF: "main"
              GITSYNC_ROOT: "/repo"
              GITSYNC_LINK: "current"
              GITSYNC_PERIOD: "60s"
              GITSYNC_SSH: "true"
              GITSYNC_SSH_KEY_FILE: "/etc/git-secret/ssh"
              GITSYNC_SSH_KNOWN_HOSTS: "true"
              GITSYNC_SSH_KNOWN_HOSTS_FILE: "/etc/git-secret/known_hosts"
              # Default max-failures=0 aborts the container on the FIRST failed
              # sync. On 2026-08-20 16:55Z a transient resolver blip
              #   "ssh: Could not resolve hostname github.com"
              # was enough to kill it (exit 1). Retry forever instead; the very
              # first sync must still succeed, so a real misconfig still fails.
              GITSYNC_MAX_FAILURES: "-1"
            securityContext:
              runAsUser: 0
              runAsGroup: 0
            probes:
              liveness: { enabled: false }
              readiness: { enabled: false }
              startup: { enabled: false }

          # ---- build: render the guides site on each sync (~1-2 min lag) ----
          # Re-resolves /repo/current every loop so it always builds the latest
          # git-synced worktree, writing static HTML into the shared emptyDir.
          build:
            image:
              repository: ghcr.io/squidfunk/mkdocs-material
              tag: 9.7.7
            command:
              - /bin/sh
              - -c
              # Rebuilds ONLY when git-sync lands a new SHA, then publishes by
              # swapping the `current` symlink with rename(2) — so nginx always
              # has a complete document root.
              #
              # Previously this ran `mkdocs build -d /site --clean` every 60s.
              # `--clean` empties /site first, so ~1440 times a day there was a
              # window where nginx returned 403 (no directory index). newt marks
              # a 403 target unhealthy -> Pangolin 503 -> Gatus alert.
              #
              # NOTE: shell variables are `$$VAR` because Flux
              # postBuild.substitute blanks unmatched `$VAR`. `$(...)` is safe.
              - |
                set -u
                CFG=/repo/current/guides/mkdocs.yml
                published=""
                while true; do
                  if [ -f "$$CFG" ]; then
                    rev=$(readlink /repo/current 2>/dev/null || true)
                    rev=$${rev##*/}
                    if [ -n "$$rev" ] && [ "$$rev" != "$$published" ]; then
                      out=/site/build-$$rev
                      rm -rf "$$out"
                      if mkdocs build -f "$$CFG" -d "$$out" --clean; then
                        ln -sfn "build-$$rev" /site/.current.new
                        mv -fT /site/.current.new /site/current
                        published="$$rev"
                        echo "[build] published $$rev"
                        for old in /site/build-*; do
                          [ -d "$$old" ] || continue
                          [ "$$old" = "$$out" ] || rm -rf "$$old"
                        done
                      else
                        echo "[build] build failed for $$rev; keeping previous site"
                        rm -rf "$$out"
                      fi
                    fi
                  else
                    echo "[build] waiting for git-sync ($$CFG)"
                  fi
                  sleep 60
                done
            probes:
              liveness: { enabled: false }
              readiness: { enabled: false }
              startup: { enabled: false }

          # ---- web: serve the rendered static site (unprivileged nginx :8080) ----
          web:
            image:
              repository: nginxinc/nginx-unprivileged
              tag: 1.31-alpine
            probes:
              liveness: &webProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  periodSeconds: 20
                  failureThreshold: 6
              readiness: *webProbe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  # Generous: first boot waits for git-sync + first build.
                  failureThreshold: 60
                  periodSeconds: 5

    service:
      app:
        controller: mkdocs
        ports:
          http:
            port: 80
            targetPort: 8080

    persistence:
      # git-sync working copy (the mkdocs-content PVC). git-sync writes; the
      # build loop reads it.
      repo:
        existingClaim: mkdocs-content
        advancedMounts:
          mkdocs:
            git-sync:
              - path: /repo
            build:
              - path: /repo
                readOnly: true

      # Rendered static HTML handed from the build loop to nginx.
      site:
        type: emptyDir
        advancedMounts:
          mkdocs:
            build:
              - path: /site
            web:
              - path: /usr/share/nginx/html
                readOnly: true

      # nginx vhost pointing at the `current` symlink the build loop swaps.
      nginx-config:
        type: configMap
        name: mkdocs-nginx-config
        advancedMounts:
          mkdocs:
            web:
              - path: /etc/nginx/conf.d
                readOnly: true

      # Read-only deploy key + pinned github.com known_hosts for git-sync.
      git-secret:
        type: secret
        name: mkdocs-git-secret
        defaultMode: 0400
        advancedMounts:
          mkdocs:
            git-sync:
              - path: /etc/git-secret
