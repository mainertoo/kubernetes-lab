apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: orcaslicer
  namespace: orcaslicer
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  maxHistory: 2

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  uninstall:
    keepHistory: false

  values:
    # All three workers carry a Raptor Lake iGPU with a working /dev/dri/renderD128,
    # and the masters are control-plane tainted, so no nodeSelector is needed — the
    # pod can only land somewhere that has the device.
    #
    # GPU access goes through the Intel device plugin, NOT a hostPath mount. A
    # hostPath makes the device nodes visible but grants no device-cgroup
    # permission: opening renderD128 then fails EPERM even as root. That is why
    # plex / immich / scrypted / dispatcharr all pair their hostPath with
    # privileged: true. The plugin injects the device with the right cgroup
    # permissions instead, so this stays unprivileged. Cost is one exclusive i915
    # slot on whichever worker it lands on (3 available, nothing else requests any).
    defaultPodOptions:
      securityContext:
        # DRI device ownership on the workers:
        #   /dev/dri/card*      -> GID 44  (video)
        #   /dev/dri/renderD128 -> GID 991 (render)   <- what OrcaSlicer's GL needs
        # Granting the two groups avoids the privileged: true the older siblings use.
        supplementalGroups:
          - 44
          - 991

    controllers:
      orcaslicer:
        # KasmVNC streams a single desktop session — a second replica would be a
        # second, unshared desktop. Keep it at one, and Recreate so the RWO
        # ceph-rbd claim detaches cleanly before the new pod attaches.
        strategy: Recreate

        # The container runs OrcaSlicer and nothing else — autostart_wayland is
        # literally /opt/orcaslicer/AppRun. There is no desktop, no file manager
        # and no browser in here, so a file that arrives on disk is invisible
        # unless something points the user at it. This init container is that
        # something: it guarantees exactly ONE folder that uploads land in, that
        # the GTK bookmark points at, and that OrcaSlicer's Open dialog reopens
        # on. Rewritten every start, so it self-heals after a pod replacement or
        # a Kopia restore.
        #
        # Why the symlink: OrcaSlicer reopens its file dialog at
        # `last_opened_folder` from OrcaSlicer.conf, which it rewrites itself and
        # which we cannot usefully own. When uploads went to /config/models while
        # that key still said /config/Desktop, uploaded files were invisible
        # unless the user knew to click the bookmark — the exact confusion this
        # was meant to remove. Collapsing Desktop into models means every path
        # the app might remember resolves to the same directory, so the dialog
        # always opens on the files regardless of where it was last.
        initContainers:
          init-model-inbox:
            image:
              repository: busybox
              tag: latest
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -e
                echo "== orcaslicer init-model-inbox =="

                # Destination for FILE_MANAGER_PATH (see the container env below).
                mkdir -p /config/models

                # Collapse a real /config/Desktop into it, once. Files are MOVED,
                # never overwritten and never deleted: a name that already exists
                # in models is left untouched in place, and a Desktop that will
                # not rmdir (because something was left behind) is renamed to
                # Desktop.bak rather than removed.
                if [ -d /config/Desktop ] && [ ! -L /config/Desktop ]; then
                  echo "Migrating /config/Desktop -> /config/models"
                  for f in /config/Desktop/* /config/Desktop/.[!.]*; do
                    [ -e "$f" ] || continue
                    b=$(basename "$f")
                    if [ -e "/config/models/$b" ]; then
                      echo "  skip (already in models): $b"
                    else
                      mv "$f" /config/models/ && echo "  moved: $b"
                    fi
                  done
                  rmdir /config/Desktop 2>/dev/null \
                    || mv /config/Desktop /config/Desktop.bak
                fi

                # Every remembered path now resolves to the one real directory.
                [ -L /config/Desktop ] || ln -s /config/models /config/Desktop

                chown -h 1000:1000 /config/Desktop
                chown 1000:1000 /config/models
                chmod 0775 /config/models

                # OrcaSlicer is wxWidgets on GTK3, so its Open dialog reads
                # $HOME/.config/gtk-3.0/bookmarks (HOME=/config here, and
                # XDG_CONFIG_HOME is unset). Each line is "URI  Display Name".
                # One entry only — Desktop is now the same directory, and a
                # second bookmark to the same place is just another wrong turn.
                mkdir -p /config/.config/gtk-3.0
                printf '%s\n' \
                  'file:///config/models 3D Models' \
                  > /config/.config/gtk-3.0/bookmarks

                chown -R 1000:1000 /config/.config/gtk-3.0
                chmod 0644 /config/.config/gtk-3.0/bookmarks

                echo "Inbox + bookmarks ready:"
                ls -ld /config/models /config/Desktop
                ls -la /config/models
                cat /config/.config/gtk-3.0/bookmarks
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false

        containers:
          app:
            image:
              repository: lscr.io/linuxserver/orcaslicer
              tag: 2.4.2
            env:
              - name: TZ
                value: America/Edmonton
              - name: PUID
                value: "1000"
              - name: PGID
                value: "1000"
              - name: TITLE
                value: OrcaSlicer
              # Hardware GL for the 3D viewport. Without this the image falls back
              # to Mesa llvmpipe software rendering, which is painful for a
              # browser-streamed 3D app.
              - name: DRINODE
                value: /dev/dri/renderD128
              # DRINODE is the RENDERING (EGL) GPU; DRI_NODE is the ENCODING GPU.
              # They are different variables and both are needed. Upstream:
              # "If both variables point to the same device, the container will
              # automatically enable Zero Copy [encoding], significantly reducing
              # CPU usage and latency."
              #
              # Without this only rendering was accelerated: the framebuffer was
              # copied out and encoded on CPU via SELKIES_ENCODER=x264enc (libx264,
              # software) at the session's native 2992x1504 (~4.5 MP) — which is
              # what made the desktop feel laggy and delayed to use. It was never
              # resource starvation: measured 45m CPU against a 4-core limit and
              # 1.68 GB against an 8Gi limit, with cgroup nr_throttled=0 over 3971
              # periods. The hardware was simply idle — vainfo reports the Intel
              # iHD driver 25.2.3 present and the i915 node already bound.
              - name: DRI_NODE
                value: /dev/dri/renderD128
              # Raptor Lake / Gen12+ — matches the dispatcharr precedent.
              - name: LIBVA_DRIVER_NAME
                value: iHD
              # Where the Selkies sidebar's file upload lands. Upstream default
              # is ~/Desktop (selkies.py: os.getenv('FILE_MANAGER_PATH',
              # '~/Desktop')) — a sane default for images that ship a desktop to
              # drop the icon onto. This one does not, so uploads landed in
              # /config/Desktop and were effectively unfindable. Point them at a
              # single obvious folder that the GTK bookmark above also targets.
              #
              # /config is the daily-Kopia-backed claim, so this doubles as a
              # backed-up shared model library rather than scratch space.
              - name: FILE_MANAGER_PATH
                value: /config/models
            # NO CUSTOM_USER / PASSWORD — Authentik is the single auth gate.
            #
            # The image's basic auth CANNOT coexist with the authentik-sso
            # forwardAuth middleware on this route: that middleware lists
            # `Authorization` in authResponseHeaders (regex
            # ^(X-authentik-|Set-Cookie|Authorization)$), so Traefik overwrites
            # the header on the upstream request and the browser's Basic
            # credentials never reach KasmVNC. Result: correct credentials are
            # rejected forever in a re-prompt loop.
            #
            # The removed comment claimed the image "defaults to abc/abc" —
            # it does not. Upstream: "HTTP Basic auth password, abc is default.
            # If unset there will be no auth." Auth only activates when PASSWORD
            # is set, so there is no default credential to defend against, and
            # LinuxServer explicitly recommends fronting this with a reverse
            # proxy's auth rather than the built-in basic auth.
            #
            # Trade-off: in-cluster traffic reaches :3000 unauthenticated, same
            # as every other app behind authentik-sso here. External access
            # still requires SSO.

            # HTTP probes are now possible (and correct). They were TCP only
            # because basic auth made every GET a 401 — but a TCP probe passes
            # straight through a hung HTTP server, which is exactly how
            # calibre-web-automated stayed "Ready" through a 3-hour deadlock.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 45
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 20
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: false
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
                # The device plugin — not the hostPath — is what actually grants
                # device-cgroup permission to open /dev/dri/renderD128.
                gpu.intel.com/i915: "1"
              limits:
                # Slicing is the CPU-hungry part and it threads well — this is the
                # whole point of slicing on cluster hardware instead of a laptop.
                cpu: "4"
                memory: 8Gi
                gpu.intel.com/i915: "1"

    service:
      app:
        controller: orcaslicer
        ports:
          http:
            port: 3000

    persistence:
      config:
        existingClaim: orcaslicer-config
        globalMounts:
          - path: /config
      # LinuxServer's KasmVNC base requires ~1G of shared memory or the embedded
      # browser/GL surface crashes. This is the k8s equivalent of --shm-size=1gb.
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
