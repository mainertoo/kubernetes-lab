apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tautulli
  namespace: media
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  values:
    controllers:
      main:
        replicas: 1
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/tautulli
              tag: 2.19.1
              pullPolicy: IfNotPresent

            env:
              PUID:
                value: "1000"
              PGID:
                value: "1000"
              TZ:
                value: America/Edmonton

            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        supplementalGroups:
          - 991

    service:
      main:
        enabled: true
        controller: main
        ports:
          http:
            port: 8181

    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: tautulli
        globalMounts:
          - path: /config