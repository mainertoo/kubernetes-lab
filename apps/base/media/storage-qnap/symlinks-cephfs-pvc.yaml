apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: symlinks-cephfs
  namespace: media
  # Intentionally NOT volsync-labelled: legacy symlink farm from the pre-DUMB
  # stack (Riven, retired 2026-11-10). Still mounted at /mnt/symlinks by Plex,
  # Jellyfin and the *arrs, but it holds no durable state.
spec:
  storageClassName: cephfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi