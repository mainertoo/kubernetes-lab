apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Shared `media` namespace: it is owned by apps/base/media/storage-qnap
# (Flux Kustomization media-storage-qnap), so no Namespace object here.
namespace: media
resources:
  - chaptarr-oidc.sops.yaml
  - chaptarr-pvc.yaml
  - chaptarr-mediacover-pvc.yaml
  - chaptarr-release.yaml
  - chaptarr-ingressroute.yaml
  - chaptarr-sync-pvc.yaml
  - chaptarr-sync-cronjob.yaml

# Init script that writes the native-OIDC settings into /config/config.xml
# (Chaptarr reads OIDC only from config.xml). Hash suffix ON so editing it rolls
# the pod; kustomizeconfig.yaml rewrites the HelmRelease reference.
configMapGenerator:
  - name: chaptarr-oidc-config
    files:
      - oidc-config/oidc-config.sh
    options:
      # Flux postBuild would envsubst the script's shell ${...} into empty strings.
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  # Two-way library sync run by the chaptarr-sync CronJob (kustomize rewrites
  # the CronJob's configMap reference to the hashed name natively).
  - name: chaptarr-sync-script
    files:
      - sync/chaptarr_sync.py
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled

configurations:
  - kustomizeconfig.yaml
