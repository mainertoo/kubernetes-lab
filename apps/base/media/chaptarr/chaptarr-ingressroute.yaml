apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: chaptarr-ingressroute
  namespace: media
  annotations:
    gethomepage.dev/href: "https://chaptarr.lab.mainertoo.com"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Chaptarr"
    gethomepage.dev/description: "Audiobooks + ebooks (Readarr fork)"
    gethomepage.dev/app: chaptarr
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "sh-readarr.svg"
spec:
  entryPoints:
    - websecure
    - web
  routes:
    - match: Host(`chaptarr.lab.mainertoo.com`)
      kind: Rule
      # No forward-auth: Chaptarr does native OIDC against Authentik (Settings →
      # General → Security → Authentication = OIDC; issuer
      # https://authentik.lab.mainertoo.com/application/o/chaptarr/, redirect URI
      # https://chaptarr.lab.mainertoo.com/signin-oidc). Same pattern as
      # Audiobookshelf/ReadMeABook. Keeps API-key clients working.
      # middlewares:
      #   - name: authentik-sso
      #     namespace: traefik-system
      services:
        - name: chaptarr
          port: 8789
          scheme: http
  tls: {}
