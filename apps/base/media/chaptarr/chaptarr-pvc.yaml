apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chaptarr
  namespace: media
  labels:
    # Label-driven Kopia backup (docs/label-driven-backups.md). Fresh app:
    # no dataSourceRef — Kyverno adds the restore ref on a future rebuild.
    backup: daily
    backup-engine: kopia
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 5Gi
