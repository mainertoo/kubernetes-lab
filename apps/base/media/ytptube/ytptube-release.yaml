apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ytptube
  namespace: media
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  maxHistory: 2

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  uninstall:
    keepHistory: false

  values:
    controllers:
      ytptube:
        pod:
          # Image runs as uid/gid 1000 (`app`); fsGroup makes the ceph-rbd
          # /config root writable. The QNAP share is already 1000:100 0777.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/arabcoders/ytptube
              tag: v2.7.6
            env:
              - name: TZ
                value: America/Los_Angeles
              # Land finished downloads in the existing QNAP youtube library
              # folder so Plex/Jellyfin can pick them up; temp stays on the NAS
              # too so large merges don't fill node ephemeral storage.
              - name: YTP_DOWNLOAD_PATH
                value: /data/media/youtube
              - name: YTP_TEMP_PATH
                value: /data/media/tmp/ytptube
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: 8081
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: 8081
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi

    service:
      # Key == release name so the Service renders as bare `ytptube`
      # (matches the IngressRoute + internal Gatus target).
      ytptube:
        controller: ytptube
        ports:
          http:
            port: 8081

    persistence:
      config:
        existingClaim: ytptube-config
        globalMounts:
          - path: /config
      # QNAP media share (RW) — downloads go to /data/media/youtube.
      qnap-media:
        existingClaim: qnap-media-pvc
        globalMounts:
          - path: /data
