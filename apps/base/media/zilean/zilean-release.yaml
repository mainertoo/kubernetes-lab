apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zilean
  namespace: media
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  values:
    fullnameOverride: zilean

    # The h1n054ur image runs as uid 100 (zilean), not root. Both PVCs are
    # group-owned by gid 1000 with mode 2775, so fsGroup 1000 gives it write
    # access without a recursive chown.
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      main:
        replicas: 1
        containers:
          main:
            image:
              # Community fork that took over from iPromKnight (dormant since
              # v3.5.0, 2025-05) via Thoroslives; it reads DMM's post-2026-09-30
              # hashlist layout. Its migrations change data: roll back by
              # restoring the CNPG backup, not by starting the old image.
              repository: ghcr.io/h1n054ur/zilean
              tag: v4.2.0
              pullPolicy: IfNotPresent

            env:
              ASPNETCORE_URLS: "http://+:8282"

              # CNPG cutover 2026-05-09 (Phase 3a-cutover):
              # - PGUSER / PGPASSWORD come from the CNPG-generated zilean-db-app
              #   Secret. CNPG rotates these on cluster recovery and the K8s
              #   $(VAR) substitution below resolves them on every pod start.
              # - bjw-s app-template renders env maps as alphabetically-ordered
              #   lists; P < Z, so PGUSER+PGPASSWORD evaluate before the
              #   Zilean__... reference, which $(VAR) substitution requires.
              # - Legacy zilean-env / ZILEAN_DB_CONNECTION no longer referenced;
              #   cleaned up in Phase 3a-decommission after 24h soak.
              PGUSER:
                valueFrom:
                  secretKeyRef:
                    name: zilean-db-app
                    key: username
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: zilean-db-app
                    key: password

              Zilean__Database__ConnectionString: "Host=zilean-db-rw;Port=5432;Database=zilean;Username=$(PGUSER);Password=$(PGPASSWORD);Include Error Detail=true;Timeout=30;CommandTimeout=3600"

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              # No CPU limit: the hourly DMM sync was pinned at 2 cores. The
              # first sync on v4.2.0 used 1.6Gi, so 2Gi left too little room.
              limits:
                memory: 4Gi

    service:
      main:
        enabled: true
        controller: main
        ports:
          http:
            port: 8282

    persistence:
      data:
        enabled: true
        existingClaim: zilean-data
        # /app/data is where Zilean keeps settings.json (API key), the IMDb
        # file and the ~3G DMM hashlist clone. Mounted from the `appdata`
        # sub-folder, which the app user owns; the volume root still holds
        # stale root-owned files from 2025 that it cannot rewrite.
        globalMounts:
          - path: /app/data
            subPath: appdata
      tmp:
        enabled: true
        existingClaim: zilean-tmp
        globalMounts:
          - path: /tmp