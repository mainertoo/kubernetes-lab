apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
  namespace: home-assistant
spec:
  interval: 30m
  releaseName: zigbee2mqtt

  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    force: true
    cleanupOnFail: true
    remediation:
      retries: 3

  uninstall:
    keepHistory: false

  values:
    controllers:
      zigbee2mqtt:
        containers:
          app:
            image:
              repository: ghcr.io/koenkk/zigbee2mqtt
              tag: 2.14.1

            ports:
              - name: http
                containerPort: 8080
                protocol: TCP

            envFrom:
              - secretRef:
                  name: zigbee2mqtt
            env:
              TZ: America/Los_Angeles
              ZIGBEE2MQTT_DATA: /config

              ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: "true"
              ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: "8080"
              ZIGBEE2MQTT_CONFIG_FRONTEND_URL: "https://zigbee2mqtt.lab.mainertoo.com"

              ZIGBEE2MQTT_CONFIG_MQTT_SERVER: "mqtt://mosquitto.home-assistant.svc.cluster.local:1883"
              ZIGBEE2MQTT_CONFIG_MQTT_VERSION: "5"
              ZIGBEE2MQTT_CONFIG_MQTT_KEEPALIVE: "60"
              ZIGBEE2MQTT_CONFIG_MQTT_INCLUDE_DEVICE_INFORMATION: "true"

              ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED: "true"

              # Per-device availability. Without this, z2m only publishes the
              # bridge's own state, so HA entities go `unavailable` when the
              # bridge dies but NEVER when a device falls off the mesh — a dead
              # leak sensor or shut-off valve keeps reporting its last state and
              # looks healthy. Needed for the water-leak offline watchdog.
              #
              # active  = mains/router devices, pinged every N minutes.
              # passive = battery end devices (the Aqara leak sensors and the
              #           T1 valve), flagged offline after N minutes of silence.
              #           z2m's default is 1500 (25 h) — far too slow to trust for
              #           leak protection. 720 (12 h) was a deliberately
              #           conservative first step while the T1 valve's heartbeat
              #           interval was unknown.
              #
              # 2026-08-13: TIGHTENED 720 -> 180 on measured evidence. Report
              # intervals over a 12 h window (2161 publishes, from the z2m log):
              #
              #     Aqara leak sensors x6   median 50 min   MAX 101 min
              #     T1 valve                median  3 min   MAX  51 min
              #     mains routers           median  1 min   MAX  11 min
              #
              # Worst observed gap is 101 min, so 180 keeps ~1.8x headroom and
              # tolerates ~3 consecutive missed heartbeats before flagging a
              # device offline. Nothing exceeded 180 in the window.
              #
              # If false "leak protection degraded" alerts start appearing, raise
              # this first — re-run the same measurement before assuming a device
              # is genuinely dead.
              ZIGBEE2MQTT_CONFIG_AVAILABILITY_ENABLED: "true"
              ZIGBEE2MQTT_CONFIG_AVAILABILITY_ACTIVE_TIMEOUT: "10"
              ZIGBEE2MQTT_CONFIG_AVAILABILITY_PASSIVE_TIMEOUT: "180"

              ZIGBEE2MQTT_CONFIG_ADVANCED_LOG_LEVEL: "info"
              ZIGBEE2MQTT_CONFIG_ADVANCED_LOG_OUTPUT: '["console"]'
              ZIGBEE2MQTT_CONFIG_ADVANCED_LAST_SEEN: "ISO_8601"

            # The Zigbee coordinator is network-attached (tcp://192.168.1.55:6638).
            # When that TCP socket drops, z2m stops its adapter (restart=false) but
            # the container PID stays alive, so K8s never restarts it and the frontend
            # on :8080 goes dead silently. An HTTP liveness probe on the frontend
            # catches that wedge and restarts the container so it reconnects.
            probes:
              liveness: &fe-probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *fe-probe
              # Give the coordinator-connect + frontend boot up to ~150s before
              # liveness engages, so a slow/unreachable adapter at startup doesn't
              # trigger a restart loop.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 30

        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: zigbee2mqtt
        ports:
          http:
            port: 80
            targetPort: 8080

    persistence:
      config:
        enabled: true
        existingClaim: zigbee2mqtt
        globalMounts:
          - path: /config

    defaultPodOptions:
      automountServiceAccountToken: false