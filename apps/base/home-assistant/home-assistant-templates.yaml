# ═════════════════════════════════════════════════════════════════════════════
# ENERGY MONITORING
#
# The SolarEdge site has NO meter (inventory `meters: []`) and SCE is not an
# Opower utility, so nothing in the house measures grid import/export yet. The
# Energy dashboard (prefs in /config/.storage/energy, NOT git — see the wiki
# page smart-home/energy) therefore carries solar + individual devices only.
# These entities fill the gaps: a TOU price, per-device cost/CO2, rack power.
#
# Accumulators below are trigger-based and add the DELTA since the last update,
# held in a `last_energy` attribute, so a source dropping to unavailable never
# loses the kWh that accrued while it was away. They use total_increasing (not
# `total`) so a lost restore reads as a meter reset, never a negative change.
# ─────────────────────────────────────────────────────────────────────────────
# SCE TOU-D-PRIME (NEM 2.0) — delivered $/kWh, per sce.com rate-plan page
# (Sept 2026). ⚠️ Rates change a few times a year: re-check against the bill
# and edit the numbers here. The $0.79/day Base Services Charge is fixed and
# not modelled. SCE TOU holidays count as weekends; only Jul 4 (Mon Jul 5 when
# the 4th is a Sunday) and Labor Day land in summer, the rest are winter where
# weekday and weekend prices are identical.
#
#                  4–9 PM                 all other hours
#   Summer Jun–Sep weekday 0.59 on-peak   0.26 off-peak
#                  weekend 0.40 mid-peak
#   Winter Oct–May 0.56 mid-peak          0.24 off-peak & super-off-peak (8a–4p)
# ─────────────────────────────────────────────────────────────────────────────

- sensor:
    - name: "Electricity Price"
      unique_id: sce_tou_d_prime_price
      unit_of_measurement: "USD/kWh"
      state_class: measurement
      icon: mdi:currency-usd
      state: >
        {%- set n = now() -%}
        {%- set wd = n.weekday() -%}
        {%- set holiday = (n.month == 7 and n.day == 4)
              or (n.month == 7 and n.day == 5 and wd == 0)
              or (n.month == 9 and wd == 0 and n.day <= 7) -%}
        {%- set peak = 16 <= n.hour < 21 -%}
        {%- if n.month in [6, 7, 8, 9] -%}
          {{ ((0.40 if wd >= 5 or holiday else 0.59) if peak else 0.26) }}
        {%- else -%}
          {{ 0.56 if peak else 0.24 }}
        {%- endif -%}
      attributes:
        plan: "SCE TOU-D-PRIME"
        season: "{{ 'summer' if now().month in [6, 7, 8, 9] else 'winter' }}"
        period: >-
          {%- set n = now() -%}
          {%- set wd = n.weekday() -%}
          {%- set holiday = (n.month == 7 and n.day == 4)
                or (n.month == 7 and n.day == 5 and wd == 0)
                or (n.month == 9 and wd == 0 and n.day <= 7) -%}
          {%- if 16 <= n.hour < 21 -%}
            {{ 'on_peak' if n.month in [6, 7, 8, 9] and wd < 5 and not holiday else 'mid_peak' }}
          {%- elif n.month not in [6, 7, 8, 9] and 8 <= n.hour < 16 -%}
            super_off_peak
          {%- else -%}
            off_peak
          {%- endif -%}

# ─────────────────────────────────────────────────────────────────────────────
# 3D printer — Shelly Plug US Gen4 (office) feeding the QIDI Max 4 power bar
# (printer + QIDI Box + accessories), device "3D Printer Plug".
#
# Measured 2026-09-11/12: idle 14.3 W flat; printing ~225 W mean with
# 700 W heat-up surges; chamber-heated prints ~355 W mean, 1,245 W peaks.
#
# Source entities:
#   sensor.3d_printer_plug_power    W
#   sensor.3d_printer_plug_energy   kWh, on-device counter (survives HA restarts)
#   switch.3d_printer_plug          ⚠️ cuts the printer — NOT exposed to Assist
# ─────────────────────────────────────────────────────────────────────────────

- binary_sensor:
    - name: "3D Printer Active"
      unique_id: printer_3d_active
      device_class: running
      # Idle is ~14 W; bed/hotend PWM never dips below ~70 W mid-print. The
      # delay_off rides through heater cycling and short pauses.
      state: "{{ states('sensor.3d_printer_plug_power') | float(0) > 40 }}"
      availability: "{{ has_value('sensor.3d_printer_plug_power') }}"
      delay_on: "00:01:00"
      delay_off: "00:10:00"

- triggers:
    - trigger: state
      entity_id: sensor.3d_printer_plug_energy
  sensor:
    - name: "3D Printer Energy Cost"
      unique_id: printer_3d_energy_cost
      unit_of_measurement: USD
      state_class: total_increasing
      icon: mdi:printer-3d
      state: >
        {%- set prev = this.state | float(0) -%}
        {%- set last = this.attributes.get('last_energy') | float(none) -%}
        {%- set now_e = states('sensor.3d_printer_plug_energy') | float(none) -%}
        {%- set price = states('sensor.electricity_price') | float(none) -%}
        {%- if now_e is none or last is none or price is none -%}
          {{ prev }}
        {%- elif now_e >= last -%}
          {{ (prev + (now_e - last) * price) | round(4) }}
        {%- else -%}
          {{ (prev + now_e * price) | round(4) }}
        {%- endif -%}
      attributes:
        last_energy: >
          {%- set now_e = states('sensor.3d_printer_plug_energy') | float(none) -%}
          {{ now_e if now_e is not none else this.attributes.get('last_energy') }}
    # Electricity Maps zone US-CAL-CISO. No device_class on purpose: `weight`
    # would be auto-converted to lb on this US-unit instance.
    - name: "3D Printer CO2"
      unique_id: printer_3d_co2
      unit_of_measurement: kg
      state_class: total_increasing
      icon: mdi:molecule-co2
      state: >
        {%- set prev = this.state | float(0) -%}
        {%- set last = this.attributes.get('last_energy') | float(none) -%}
        {%- set now_e = states('sensor.3d_printer_plug_energy') | float(none) -%}
        {%- set g = states('sensor.electricity_maps_co2_intensity') | float(none) -%}
        {%- if now_e is none or last is none or g is none -%}
          {{ prev }}
        {%- elif now_e >= last -%}
          {{ (prev + (now_e - last) * g / 1000) | round(4) }}
        {%- else -%}
          {{ (prev + now_e * g / 1000) | round(4) }}
        {%- endif -%}
      attributes:
        last_energy: >
          {%- set now_e = states('sensor.3d_printer_plug_energy') | float(none) -%}
          {{ now_e if now_e is not none else this.attributes.get('last_energy') }}

# ─────────────────────────────────────────────────────────────────────────────
# Laundry-room rack — two CyberPower UPSes via NUT (HA nut integration).
#   cabinet @ pve-zermatt 192.168.1.108  CP2000PFCRM2U  zermatt, mac, UDM SE, XG24, QNAP
#   pr1500  @ pve-mammoth 192.168.1.109  CP1500PFCRM2U  mammoth, whistler, USW Aggregation
#
# CyberPower reports only an integer load %, so watts = load% × nominal real
# power — an ESTIMATE with 12 W (CP2000) / 10 W (PR1500) resolution. Energy is a
# 1-minute left Riemann sum; minutes while HA is down are not counted.
# ─────────────────────────────────────────────────────────────────────────────

- sensor:
    - name: "Rack UPS CP2000 Power"
      unique_id: rack_ups_cp2000_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {{ (states('sensor.cabinet_load') | float(0) * states('sensor.cabinet_nominal_real_power') | float(0) / 100) | round(0) }}
      availability: "{{ has_value('sensor.cabinet_load') and has_value('sensor.cabinet_nominal_real_power') }}"
    - name: "Rack UPS PR1500 Power"
      unique_id: rack_ups_pr1500_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {{ (states('sensor.pr1500_load') | float(0) * states('sensor.pr1500_nominal_real_power') | float(0) / 100) | round(0) }}
      availability: "{{ has_value('sensor.pr1500_load') and has_value('sensor.pr1500_nominal_real_power') }}"
    - name: "Server Rack Power"
      unique_id: server_rack_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {{ states('sensor.rack_ups_cp2000_power') | float(0) + states('sensor.rack_ups_pr1500_power') | float(0) }}
      availability: >
        {{ has_value('sensor.rack_ups_cp2000_power') or has_value('sensor.rack_ups_pr1500_power') }}

- triggers:
    - trigger: time_pattern
      minutes: "/1"
  sensor:
    - name: "Server Rack Energy"
      unique_id: server_rack_energy
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
      state: >
        {%- set w = states('sensor.server_rack_power') | float(none) -%}
        {{ (this.state | float(0) + (w / 60000 if w is not none else 0)) | round(5) }}
    - name: "Server Rack Energy Cost"
      unique_id: server_rack_energy_cost
      unit_of_measurement: USD
      state_class: total_increasing
      icon: mdi:server
      state: >
        {%- set w = states('sensor.server_rack_power') | float(none) -%}
        {%- set price = states('sensor.electricity_price') | float(none) -%}
        {{ (this.state | float(0) + (w / 60000 * price if w is not none and price is not none else 0)) | round(4) }}

# ─────────────────────────────────────────────────────────────────────────────
# 3D printer — per-print energy, cost and CO2. Print state comes from the
# Moonraker integration (HACS marcolivierarsenault/moonraker-home-assistant,
# device "QIDI Max 4", 192.168.20.56:7125):
#
#   sensor.qidi_max_4_current_print_state  standby|printing|paused|complete|cancelled|error
#   sensor.qidi_max_4_filename             ⚠️ cleared the instant the state hits standby
#   sensor.qidi_max_4_print_duration       min, excludes pauses; ⚠️ zeroed at standby
#   sensor.qidi_max_4_filament_used        m; ⚠️ zeroed at standby
#
# START = printing from standby/complete/cancelled/error. Deliberately NOT from
# unavailable/unknown: an HA restart or Moonraker blip mid-print must not take a
# fresh snapshot. A resume from paused is not a new print either.
# END   = complete/cancelled/error/standby from printing/paused, or from
# unavailable/unknown so a print that finishes while HA is down is still recorded.
#
# ⚠️ `standby` MUST be an END state. QIDI's end-of-print macro resets Klipper's
# print_stats straight to standby, so Moonraker's transient `complete` is usually
# gone before the integration's next poll (~31 s): 5 of the 7 prints on
# 2026-09-16/17 went printing → standby with no `complete` at all, and every one
# of them was silently skipped — filament cost recorded, electricity cost missing.
#
# ⚠️ The same poll that reports `standby` also zeroes filename/print_duration/
# filament_used, so END alone cannot describe the job. END therefore records the
# kWh immediately (the one value that is lost forever if missed) and BACKFILL
# fills the descriptive attributes in when Moonraker publishes the finished job
# to sensor.3d_printer_job_history_0 (printer_costs.yaml, 60 s REST poll) — that
# sensor's state IS the job status, so it steps in_progress → completed exactly
# once per print. Capturing at END rather than waiting avoids losing a print that
# is cancelled and immediately restarted (observed: 62 s apart on 2026-09-16).
#
# Each sensor snapshots its own counter into a `start` attribute at START and
# publishes the difference at END, then clears `start`. An END with no snapshot
# (a print already running when HA came up) is skipped, never reported as a
# bogus total.
# ─────────────────────────────────────────────────────────────────────────────

- triggers:
    - trigger: state
      entity_id: sensor.qidi_max_4_current_print_state
      from: [standby, complete, cancelled, error]
      to: printing
      id: start
    - trigger: state
      entity_id: sensor.qidi_max_4_current_print_state
      from: [printing, paused, unavailable, unknown]
      to: [complete, cancelled, error, standby]
      id: end
    - trigger: state
      entity_id: sensor.3d_printer_job_history_0
      to: [completed, cancelled, error, interrupted, klippy_shutdown, klippy_disconnect, server_exit]
      id: backfill
  variables:
    # The job Moonraker just filed, used only by BACKFILL. `float(0)` / `or ''`
    # keep these native types the entity templates can test without None handling.
    hist_status: "{{ states('sensor.3d_printer_job_history_0') }}"
    hist_name: "{{ state_attr('sensor.3d_printer_job_history_0', 'filename') or '' }}"
    hist_end: "{{ state_attr('sensor.3d_printer_job_history_0', 'end_time') | float(0) }}"
    hist_minutes: "{{ ((state_attr('sensor.3d_printer_job_history_0', 'print_duration') | float(0)) / 60) | round(0) }}"
    hist_filament_m: "{{ ((state_attr('sensor.3d_printer_job_history_0', 'filament_used') | float(0)) / 1000) | round(2) }}"
  sensor:
    - name: "3D Printer Last Print Energy"
      unique_id: printer_3d_last_print_energy
      unit_of_measurement: kWh
      device_class: energy
      icon: mdi:printer-3d-nozzle
      state: >
        {%- set start = this.attributes.get('start') | float(none) -%}
        {%- set now_v = states('sensor.3d_printer_plug_energy') | float(none) -%}
        {%- if trigger.id == 'end' and start is not none and now_v is not none and now_v >= start -%}
          {{ (now_v - start) | round(3) }}
        {%- else -%}
          {{ this.state if this.state | is_number else 0 }}
        {%- endif -%}
      attributes:
        # Cleared at END; preserved on BACKFILL (which only ever fires while idle).
        start: >
          {%- if trigger.id == 'start' -%}
            {{ states('sensor.3d_printer_plug_energy') | float(none) }}
          {%- elif trigger.id == 'end' -%}
            {{ none }}
          {%- else -%}
            {{ this.attributes.get('start') }}
          {%- endif -%}
        start_time: >
          {%- if trigger.id == 'start' -%}
            {{ now().isoformat() }}
          {%- elif trigger.id == 'end' -%}
            {{ none }}
          {%- else -%}
            {{ this.attributes.get('start_time') }}
          {%- endif -%}
        # true between a valid END and the BACKFILL that completes the record. It is
        # what stops a backfill from pasting a new job's details onto an older record
        # (a print that ran entirely while HA was down leaves no END, so no pending).
        pending: >
          {%- if trigger.id == 'end' -%}
            {{ this.attributes.get('start') is number }}
          {%- elif trigger.id == 'backfill' -%}
            false
          {%- else -%}
            {{ this.attributes.get('pending') or false }}
          {%- endif -%}
        # The record of the last FINISHED print — only rewritten on a valid END, then
        # completed from Moonraker's job history on BACKFILL. `none` in between means
        # "ended, details not published yet", never a value from the previous print.
        filename: >
          {%- set ok = trigger.id == 'end' and this.attributes.get('start') is number -%}
          {%- set fill = trigger.id == 'backfill' and this.attributes.get('pending') and hist_end | float(0) > 0 -%}
          {%- if fill and hist_name | string | length > 0 -%}
            {{ hist_name }}
          {%- elif ok -%}
            {%- set live = states('sensor.qidi_max_4_filename') -%}
            {{ live if live not in ['', 'unknown', 'unavailable'] else none }}
          {%- else -%}
            {{ this.attributes.get('filename') }}
          {%- endif -%}
        result: >
          {%- set ok = trigger.id == 'end' and this.attributes.get('start') is number -%}
          {%- set fill = trigger.id == 'backfill' and this.attributes.get('pending') and hist_end | float(0) > 0 -%}
          {%- if fill -%}
            {{ hist_status }}
          {%- elif ok -%}
            {#- `standby` is how the print ended, not how it turned out — BACKFILL supplies that. -#}
            {{ trigger.to_state.state if trigger.to_state.state != 'standby' else none }}
          {%- else -%}
            {{ this.attributes.get('result') }}
          {%- endif -%}
        started: >
          {%- set ok = trigger.id == 'end' and this.attributes.get('start') is number -%}
          {{ this.attributes.get('start_time') if ok else this.attributes.get('started') }}
        # END stamps now() so printer_costs.yaml can match the job straight away;
        # BACKFILL replaces it with Moonraker's exact end time.
        ended: >
          {%- set ok = trigger.id == 'end' and this.attributes.get('start') is number -%}
          {%- set fill = trigger.id == 'backfill' and this.attributes.get('pending') and hist_end | float(0) > 0 -%}
          {%- if fill -%}
            {{ hist_end | float(0) | timestamp_local }}
          {%- elif ok -%}
            {{ now().isoformat() }}
          {%- else -%}
            {{ this.attributes.get('ended') }}
          {%- endif -%}
        print_minutes: >
          {%- set ok = trigger.id == 'end' and this.attributes.get('start') is number -%}
          {%- set fill = trigger.id == 'backfill' and this.attributes.get('pending') and hist_end | float(0) > 0 -%}
          {%- if fill -%}
            {{ hist_minutes | float(0) | round(0) }}
          {%- elif ok -%}
            {%- set live = states('sensor.qidi_max_4_print_duration') | float(0) -%}
            {{ live | round(0) if live > 0 else none }}
          {%- else -%}
            {{ this.attributes.get('print_minutes') }}
          {%- endif -%}
        filament_m: >
          {%- set ok = trigger.id == 'end' and this.attributes.get('start') is number -%}
          {%- set fill = trigger.id == 'backfill' and this.attributes.get('pending') and hist_end | float(0) > 0 -%}
          {%- if fill -%}
            {{ hist_filament_m | float(0) | round(2) }}
          {%- elif ok -%}
            {%- set live = states('sensor.qidi_max_4_filament_used') | float(0) -%}
            {{ live | round(2) if live > 0 else none }}
          {%- else -%}
            {{ this.attributes.get('filament_m') }}
          {%- endif -%}
    - name: "3D Printer Last Print Cost"
      unique_id: printer_3d_last_print_cost
      unit_of_measurement: USD
      icon: mdi:currency-usd
      state: >
        {%- set start = this.attributes.get('start') | float(none) -%}
        {%- set now_v = states('sensor.3d_printer_energy_cost') | float(none) -%}
        {%- if trigger.id == 'end' and start is not none and now_v is not none and now_v >= start -%}
          {{ (now_v - start) | round(2) }}
        {%- else -%}
          {{ this.state if this.state | is_number else 0 }}
        {%- endif -%}
      attributes:
        start: >
          {%- if trigger.id == 'start' -%}
            {{ states('sensor.3d_printer_energy_cost') | float(none) }}
          {%- elif trigger.id == 'end' -%}
            {{ none }}
          {%- else -%}
            {{ this.attributes.get('start') }}
          {%- endif -%}
    - name: "3D Printer Last Print CO2"
      unique_id: printer_3d_last_print_co2
      unit_of_measurement: kg
      icon: mdi:molecule-co2
      state: >
        {%- set start = this.attributes.get('start') | float(none) -%}
        {%- set now_v = states('sensor.3d_printer_co2') | float(none) -%}
        {%- if trigger.id == 'end' and start is not none and now_v is not none and now_v >= start -%}
          {{ (now_v - start) | round(3) }}
        {%- else -%}
          {{ this.state if this.state | is_number else 0 }}
        {%- endif -%}
      attributes:
        start: >
          {%- if trigger.id == 'start' -%}
            {{ states('sensor.3d_printer_co2') | float(none) }}
          {%- elif trigger.id == 'end' -%}
            {{ none }}
          {%- else -%}
            {{ this.attributes.get('start') }}
          {%- endif -%}

# Running totals for the print in progress; 0 when nothing is printing.
# The idle check is belt-and-braces: a `start` snapshot that is never consumed
# (a missed END, as happened before `standby` became an END state) would otherwise
# leave these climbing forever against a stale baseline.
- sensor:
    - name: "3D Printer Current Print Energy"
      unique_id: printer_3d_current_print_energy
      unit_of_measurement: kWh
      device_class: energy
      icon: mdi:printer-3d-nozzle
      state: >
        {%- set idle = states('sensor.qidi_max_4_current_print_state') in ['standby', 'complete', 'cancelled', 'error'] -%}
        {%- set start = state_attr('sensor.3d_printer_last_print_energy', 'start') | float(none) -%}
        {%- set now_v = states('sensor.3d_printer_plug_energy') | float(none) -%}
        {{ (now_v - start) | round(3) if not idle and start is not none and now_v is not none and now_v >= start else 0 }}
    - name: "3D Printer Current Print Cost"
      unique_id: printer_3d_current_print_cost
      unit_of_measurement: USD
      icon: mdi:currency-usd
      state: >
        {%- set idle = states('sensor.qidi_max_4_current_print_state') in ['standby', 'complete', 'cancelled', 'error'] -%}
        {%- set start = state_attr('sensor.3d_printer_last_print_cost', 'start') | float(none) -%}
        {%- set now_v = states('sensor.3d_printer_energy_cost') | float(none) -%}
        {{ (now_v - start) | round(2) if not idle and start is not none and now_v is not none and now_v >= start else 0 }}
