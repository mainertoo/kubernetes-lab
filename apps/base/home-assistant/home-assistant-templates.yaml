# home-assistant-templates.yaml — modern-syntax HA template entities.
#
# GIT IS THE SOURCE OF TRUTH for this file. It is rendered into the
# `home-assistant-templates` ConfigMap by configMapGenerator and mounted
# READ-ONLY over /config/templates.yaml in the HA pod. Editing the copy on the
# config PVC (or in code-server) no longer has any effect — the mount shadows it.
#
# The ConfigMap name is hash-suffixed, and kustomizeconfig.yaml rewrites the
# HelmRelease reference to match, so a change here rolls the HA pod and the new
# templates come up with it. No `template.reload` needed.
#
# configuration.yaml gets `template: !include templates.yaml` asserted by the
# ensure-ha-config initContainer, so a bare rebuild wires itself up.
#
# ⚠️ NAME ENTITIES BY PLACE, NEVER BY NUMBER. Assist ignores a trailing number in
# an entity name: with locks named "Sliding Door 1"/"Sliding Door 2",
# *"is sliding door 2 locked"* answered from door 1 — a silent wrong answer on a
# lock — and *"is sliding door two locked"* did not parse at all. Place-based
# names and area-qualified phrasing ("the sliding door in the dining room") both
# resolve correctly. unique_id is NOT changed by a rename, so entity IDs and all
# registry overrides survive.
# ─────────────────────────────────────────────────────────────────────────────
# Sliding Door Lock 1 (Kitchen) — Shelly 1 Gen4 @ 192.168.20.212 + Plus Add-on
#
# The LIBO drop bolt is FAIL-SAFE (power-to-lock) and has an internal interlock
# reed: it only drives the bolt when the receiver magnet is present. So the
# Shelly relay means "commanded to lock", NOT "bolt is out":
#
#   relay ON  + door closed (magnet present)  -> green LED, bolt throws  = LOCKED
#   relay ON  + door open   (magnet absent)   -> orange LED, no throw    = NOT locked
#   relay OFF                                 -> bolt retracted          = UNLOCKED
#
# Source entities:
#   switch.kitchen_sliding_door_lock_1                   relay (commanded)
#   binary_sensor.kitchen_sliding_door_lock_1_input_100  door, device_class door
#                                                        (on = Open, off = Closed)
#   event.kitchen_sliding_door_lock_1_input              button press (every press)
#
# All four states are SENSED, never actuated. Nothing here commands a door panel:
#   closed   magnet in position at the Add-on digital input (input:100)
#   open     magnet has moved away from it
#   locked   relay energised AND magnet present -> the interlock let the bolt fire
#   unlocked relay de-energised -> spring retracts the bolt
# So the lock exposes lock/unlock only; open/closed is read off the door sensor
# and mirrored onto this entity as the `door_position` attribute. A `cover` is
# NOT usable here: HA rejects one without open_cover/set_cover_position.
# ─────────────────────────────────────────────────────────────────────────────

- lock:
    - name: "Kitchen Sliding Door"
      unique_id: sliding_door_1_lock
      # Truth, not intent — both conditions must hold for the bolt to be out.
      state: >
        {{ is_state('switch.kitchen_sliding_door_lock_1', 'on')
           and is_state('binary_sensor.kitchen_sliding_door_lock_1_input_100', 'off') }}
      # Without this, a Shelly that drops off WiFi renders the lock as UNLOCKED
      # rather than unavailable — a false "all clear" on a door lock.
      availability: >
        {{ has_value('switch.kitchen_sliding_door_lock_1')
           and has_value('binary_sensor.kitchen_sliding_door_lock_1_input_100') }}
      optimistic: false
      attributes:
        # The lock domain has no native door-position state, so carry it here.
        door_position: >-
          {{ 'open' if is_state('binary_sensor.kitchen_sliding_door_lock_1_input_100', 'on')
             else 'closed' }}
        bolt: >-
          {{ 'retracted' if is_state('switch.kitchen_sliding_door_lock_1', 'off')
             else ('thrown' if is_state('binary_sensor.kitchen_sliding_door_lock_1_input_100', 'off')
                   else 'armed') }}
      lock:
        action: switch.turn_on
        target:
          entity_id: switch.kitchen_sliding_door_lock_1
      unlock:
        action: switch.turn_off
        target:
          entity_id: switch.kitchen_sliding_door_lock_1

- binary_sensor:
    - name: "Kitchen Sliding Door Lock Armed"
      unique_id: sliding_door_1_lock_armed
      device_class: problem
      # Relay energised while the door is open: it reads as locked but is not
      # secure. The bolt will throw on its own the moment the door closes.
      # 30s delay so it doesn't fire every time someone walks out.
      state: >
        {{ is_state('switch.kitchen_sliding_door_lock_1', 'on')
           and is_state('binary_sensor.kitchen_sliding_door_lock_1_input_100', 'on') }}
      availability: >
        {{ has_value('switch.kitchen_sliding_door_lock_1')
           and has_value('binary_sensor.kitchen_sliding_door_lock_1_input_100') }}
      delay_on: "00:00:30"

# ─────────────────────────────────────────────────────────────────────────────
# Sliding Door Lock 2 (Dining Room) — Shelly 1 Gen4 @ 192.168.20.194 + Plus Add-on
# Identical build to the kitchen unit; see wiki 278.
#
# ⚠️ What actually stops the bolt firing into an open doorway is the LIBO's own
# internal interlock reed — HARDWARE, not this file. The bolt only drives when
# the receiver magnet is present. These entities REPORT that truth; `lock_armed`
# is the alarm for "relay energised but the bolt never fired".
#
# Source entities:
#   switch.dining_room_sliding_door_lock_2                   relay (commanded)
#   binary_sensor.dining_room_sliding_door_lock_2_input_100  door, device_class door
#                                                            (on = Open, off = Closed)
#   event.dining_room_sliding_door_lock_2_input              button press (every press)
# ─────────────────────────────────────────────────────────────────────────────

- lock:
    - name: "Dining Room Sliding Door"
      unique_id: sliding_door_2_lock
      # Truth, not intent — both conditions must hold for the bolt to be out.
      state: >
        {{ is_state('switch.dining_room_sliding_door_lock_2', 'on')
           and is_state('binary_sensor.dining_room_sliding_door_lock_2_input_100', 'off') }}
      availability: >
        {{ has_value('switch.dining_room_sliding_door_lock_2')
           and has_value('binary_sensor.dining_room_sliding_door_lock_2_input_100') }}
      optimistic: false
      attributes:
        door_position: >-
          {{ 'open' if is_state('binary_sensor.dining_room_sliding_door_lock_2_input_100', 'on')
             else 'closed' }}
        bolt: >-
          {{ 'retracted' if is_state('switch.dining_room_sliding_door_lock_2', 'off')
             else ('thrown' if is_state('binary_sensor.dining_room_sliding_door_lock_2_input_100', 'off')
                   else 'armed') }}
      lock:
        action: switch.turn_on
        target:
          entity_id: switch.dining_room_sliding_door_lock_2
      unlock:
        action: switch.turn_off
        target:
          entity_id: switch.dining_room_sliding_door_lock_2

- binary_sensor:
    - name: "Dining Room Sliding Door Lock Armed"
      unique_id: sliding_door_2_lock_armed
      device_class: problem
      state: >
        {{ is_state('switch.dining_room_sliding_door_lock_2', 'on')
           and is_state('binary_sensor.dining_room_sliding_door_lock_2_input_100', 'on') }}
      availability: >
        {{ has_value('switch.dining_room_sliding_door_lock_2')
           and has_value('binary_sensor.dining_room_sliding_door_lock_2_input_100') }}
      delay_on: "00:00:30"

# ═════════════════════════════════════════════════════════════════════════════
# ENERGY MONITORING
#
# The SolarEdge site has NO meter (inventory `meters: []`) and SCE is not an
# Opower utility, so nothing in the house measures grid import/export yet. The
# Energy dashboard (prefs in /config/.storage/energy, NOT git — see the wiki
# page smart-home/energy) therefore carries solar + individual devices only.
# These entities fill the gaps: a TOU price, per-device cost/CO2, rack power.
#
# Accumulators below are trigger-based and add the DELTA since the last update,
# held in a `last_energy` attribute, so a source dropping to unavailable never
# loses the kWh that accrued while it was away. They use total_increasing (not
# `total`) so a lost restore reads as a meter reset, never a negative change.
# ─────────────────────────────────────────────────────────────────────────────
# SCE TOU-D-PRIME (NEM 2.0) — delivered $/kWh, per sce.com rate-plan page
# (Sept 2026). ⚠️ Rates change a few times a year: re-check against the bill
# and edit the numbers here. The $0.79/day Base Services Charge is fixed and
# not modelled. SCE TOU holidays count as weekends; only Jul 4 (Mon Jul 5 when
# the 4th is a Sunday) and Labor Day land in summer, the rest are winter where
# weekday and weekend prices are identical.
#
#                  4–9 PM                 all other hours
#   Summer Jun–Sep weekday 0.59 on-peak   0.26 off-peak
#                  weekend 0.40 mid-peak
#   Winter Oct–May 0.56 mid-peak          0.24 off-peak & super-off-peak (8a–4p)
# ─────────────────────────────────────────────────────────────────────────────

- sensor:
    - name: "Electricity Price"
      unique_id: sce_tou_d_prime_price
      unit_of_measurement: "USD/kWh"
      state_class: measurement
      icon: mdi:currency-usd
      state: >
        {%- set n = now() -%}
        {%- set wd = n.weekday() -%}
        {%- set holiday = (n.month == 7 and n.day == 4)
              or (n.month == 7 and n.day == 5 and wd == 0)
              or (n.month == 9 and wd == 0 and n.day <= 7) -%}
        {%- set peak = 16 <= n.hour < 21 -%}
        {%- if n.month in [6, 7, 8, 9] -%}
          {{ ((0.40 if wd >= 5 or holiday else 0.59) if peak else 0.26) }}
        {%- else -%}
          {{ 0.56 if peak else 0.24 }}
        {%- endif -%}
      attributes:
        plan: "SCE TOU-D-PRIME"
        season: "{{ 'summer' if now().month in [6, 7, 8, 9] else 'winter' }}"
        period: >-
          {%- set n = now() -%}
          {%- set wd = n.weekday() -%}
          {%- set holiday = (n.month == 7 and n.day == 4)
                or (n.month == 7 and n.day == 5 and wd == 0)
                or (n.month == 9 and wd == 0 and n.day <= 7) -%}
          {%- if 16 <= n.hour < 21 -%}
            {{ 'on_peak' if n.month in [6, 7, 8, 9] and wd < 5 and not holiday else 'mid_peak' }}
          {%- elif n.month not in [6, 7, 8, 9] and 8 <= n.hour < 16 -%}
            super_off_peak
          {%- else -%}
            off_peak
          {%- endif -%}

# ─────────────────────────────────────────────────────────────────────────────
# 3D printer — Shelly Plug US Gen4 (office) feeding the QIDI Max 4 power bar
# (printer + QIDI Box + accessories), device "3D Printer Plug".
#
# Measured 2026-09-11/12: idle 14.3 W flat; printing ~225 W mean with
# 700 W heat-up surges; chamber-heated prints ~355 W mean, 1,245 W peaks.
#
# Source entities:
#   sensor.3d_printer_plug_power    W
#   sensor.3d_printer_plug_energy   kWh, on-device counter (survives HA restarts)
#   switch.3d_printer_plug          ⚠️ cuts the printer — NOT exposed to Assist
# ─────────────────────────────────────────────────────────────────────────────

- binary_sensor:
    - name: "3D Printer Active"
      unique_id: printer_3d_active
      device_class: running
      # Idle is ~14 W; bed/hotend PWM never dips below ~70 W mid-print. The
      # delay_off rides through heater cycling and short pauses.
      state: "{{ states('sensor.3d_printer_plug_power') | float(0) > 40 }}"
      availability: "{{ has_value('sensor.3d_printer_plug_power') }}"
      delay_on: "00:01:00"
      delay_off: "00:10:00"

- triggers:
    - trigger: state
      entity_id: sensor.3d_printer_plug_energy
  sensor:
    - name: "3D Printer Energy Cost"
      unique_id: printer_3d_energy_cost
      unit_of_measurement: USD
      state_class: total_increasing
      icon: mdi:printer-3d
      state: >
        {%- set prev = this.state | float(0) -%}
        {%- set last = this.attributes.get('last_energy') | float(none) -%}
        {%- set now_e = states('sensor.3d_printer_plug_energy') | float(none) -%}
        {%- set price = states('sensor.electricity_price') | float(none) -%}
        {%- if now_e is none or last is none or price is none -%}
          {{ prev }}
        {%- elif now_e >= last -%}
          {{ (prev + (now_e - last) * price) | round(4) }}
        {%- else -%}
          {{ (prev + now_e * price) | round(4) }}
        {%- endif -%}
      attributes:
        last_energy: >
          {%- set now_e = states('sensor.3d_printer_plug_energy') | float(none) -%}
          {{ now_e if now_e is not none else this.attributes.get('last_energy') }}
    # Electricity Maps zone US-CAL-CISO. No device_class on purpose: `weight`
    # would be auto-converted to lb on this US-unit instance.
    - name: "3D Printer CO2"
      unique_id: printer_3d_co2
      unit_of_measurement: kg
      state_class: total_increasing
      icon: mdi:molecule-co2
      state: >
        {%- set prev = this.state | float(0) -%}
        {%- set last = this.attributes.get('last_energy') | float(none) -%}
        {%- set now_e = states('sensor.3d_printer_plug_energy') | float(none) -%}
        {%- set g = states('sensor.electricity_maps_co2_intensity') | float(none) -%}
        {%- if now_e is none or last is none or g is none -%}
          {{ prev }}
        {%- elif now_e >= last -%}
          {{ (prev + (now_e - last) * g / 1000) | round(4) }}
        {%- else -%}
          {{ (prev + now_e * g / 1000) | round(4) }}
        {%- endif -%}
      attributes:
        last_energy: >
          {%- set now_e = states('sensor.3d_printer_plug_energy') | float(none) -%}
          {{ now_e if now_e is not none else this.attributes.get('last_energy') }}

# ─────────────────────────────────────────────────────────────────────────────
# Laundry-room rack — two CyberPower UPSes via NUT (HA nut integration).
#   cabinet @ pve-zermatt 192.168.1.108  CP2000PFCRM2U  zermatt, mac, UDM SE, XG24, QNAP
#   pr1500  @ pve-mammoth 192.168.1.109  CP1500PFCRM2U  mammoth, whistler, USW Aggregation
#
# CyberPower reports only an integer load %, so watts = load% × nominal real
# power — an ESTIMATE with 12 W (CP2000) / 10 W (PR1500) resolution. Energy is a
# 1-minute left Riemann sum; minutes while HA is down are not counted.
# ─────────────────────────────────────────────────────────────────────────────

- sensor:
    - name: "Rack UPS CP2000 Power"
      unique_id: rack_ups_cp2000_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {{ (states('sensor.cabinet_load') | float(0) * states('sensor.cabinet_nominal_real_power') | float(0) / 100) | round(0) }}
      availability: "{{ has_value('sensor.cabinet_load') and has_value('sensor.cabinet_nominal_real_power') }}"
    - name: "Rack UPS PR1500 Power"
      unique_id: rack_ups_pr1500_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {{ (states('sensor.pr1500_load') | float(0) * states('sensor.pr1500_nominal_real_power') | float(0) / 100) | round(0) }}
      availability: "{{ has_value('sensor.pr1500_load') and has_value('sensor.pr1500_nominal_real_power') }}"
    - name: "Server Rack Power"
      unique_id: server_rack_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {{ states('sensor.rack_ups_cp2000_power') | float(0) + states('sensor.rack_ups_pr1500_power') | float(0) }}
      availability: >
        {{ has_value('sensor.rack_ups_cp2000_power') or has_value('sensor.rack_ups_pr1500_power') }}

- triggers:
    - trigger: time_pattern
      minutes: "/1"
  sensor:
    - name: "Server Rack Energy"
      unique_id: server_rack_energy
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
      state: >
        {%- set w = states('sensor.server_rack_power') | float(none) -%}
        {{ (this.state | float(0) + (w / 60000 if w is not none else 0)) | round(5) }}
    - name: "Server Rack Energy Cost"
      unique_id: server_rack_energy_cost
      unit_of_measurement: USD
      state_class: total_increasing
      icon: mdi:server
      state: >
        {%- set w = states('sensor.server_rack_power') | float(none) -%}
        {%- set price = states('sensor.electricity_price') | float(none) -%}
        {{ (this.state | float(0) + (w / 60000 * price if w is not none and price is not none else 0)) | round(4) }}

# ─────────────────────────────────────────────────────────────────────────────
# 3D printer — per-print energy, cost and CO2. Print state comes from the
# Moonraker integration (HACS marcolivierarsenault/moonraker-home-assistant,
# device "QIDI Max 4", 192.168.20.56:7125):
#
#   sensor.qidi_max_4_current_print_state  standby|printing|paused|complete|cancelled|error
#   sensor.qidi_max_4_filename             kept after a print ends, until the next starts
#   sensor.qidi_max_4_print_duration       min, excludes pauses
#   sensor.qidi_max_4_filament_used        m
#
# START = printing from standby/complete/cancelled/error. Deliberately NOT from
# unavailable/unknown: an HA restart or Moonraker blip mid-print must not take a
# fresh snapshot. A resume from paused is not a new print either.
# END   = complete/cancelled/error from printing/paused, or from unavailable/
# unknown so a print that finishes while HA is down is still recorded.
#
# Each sensor snapshots its own counter into a `start` attribute at START and
# publishes the difference at END, then clears `start`. An END with no snapshot
# (a print already running when HA came up) is skipped, never reported as a
# bogus total. Filename/duration/filament are read at END — at START Moonraker
# may not have published the new job yet.
# ─────────────────────────────────────────────────────────────────────────────

- triggers:
    - trigger: state
      entity_id: sensor.qidi_max_4_current_print_state
      from: [standby, complete, cancelled, error]
      to: printing
      id: start
    - trigger: state
      entity_id: sensor.qidi_max_4_current_print_state
      from: [printing, paused, unavailable, unknown]
      to: [complete, cancelled, error]
      id: end
  sensor:
    - name: "3D Printer Last Print Energy"
      unique_id: printer_3d_last_print_energy
      unit_of_measurement: kWh
      device_class: energy
      icon: mdi:printer-3d-nozzle
      state: >
        {%- set start = this.attributes.get('start') | float(none) -%}
        {%- set now_v = states('sensor.3d_printer_plug_energy') | float(none) -%}
        {%- if trigger.id == 'end' and start is not none and now_v is not none and now_v >= start -%}
          {{ (now_v - start) | round(3) }}
        {%- else -%}
          {{ this.state if this.state | is_number else 0 }}
        {%- endif -%}
      attributes:
        start: >
          {{ states('sensor.3d_printer_plug_energy') | float(none) if trigger.id == 'start' else none }}
        start_time: >
          {{ now().isoformat() if trigger.id == 'start' else none }}
        # The record of the last FINISHED print — only rewritten on a valid END.
        filename: >
          {%- set ok = trigger.id == 'end' and this.attributes.get('start') is number -%}
          {{ states('sensor.qidi_max_4_filename') if ok else this.attributes.get('filename') }}
        result: >
          {%- set ok = trigger.id == 'end' and this.attributes.get('start') is number -%}
          {{ trigger.to_state.state if ok else this.attributes.get('result') }}
        started: >
          {%- set ok = trigger.id == 'end' and this.attributes.get('start') is number -%}
          {{ this.attributes.get('start_time') if ok else this.attributes.get('started') }}
        ended: >
          {%- set ok = trigger.id == 'end' and this.attributes.get('start') is number -%}
          {{ now().isoformat() if ok else this.attributes.get('ended') }}
        print_minutes: >
          {%- set ok = trigger.id == 'end' and this.attributes.get('start') is number -%}
          {{ states('sensor.qidi_max_4_print_duration') | float(0) | round(0) if ok else this.attributes.get('print_minutes') }}
        filament_m: >
          {%- set ok = trigger.id == 'end' and this.attributes.get('start') is number -%}
          {{ states('sensor.qidi_max_4_filament_used') | float(0) | round(2) if ok else this.attributes.get('filament_m') }}
    - name: "3D Printer Last Print Cost"
      unique_id: printer_3d_last_print_cost
      unit_of_measurement: USD
      icon: mdi:currency-usd
      state: >
        {%- set start = this.attributes.get('start') | float(none) -%}
        {%- set now_v = states('sensor.3d_printer_energy_cost') | float(none) -%}
        {%- if trigger.id == 'end' and start is not none and now_v is not none and now_v >= start -%}
          {{ (now_v - start) | round(2) }}
        {%- else -%}
          {{ this.state if this.state | is_number else 0 }}
        {%- endif -%}
      attributes:
        start: >
          {{ states('sensor.3d_printer_energy_cost') | float(none) if trigger.id == 'start' else none }}
    - name: "3D Printer Last Print CO2"
      unique_id: printer_3d_last_print_co2
      unit_of_measurement: kg
      icon: mdi:molecule-co2
      state: >
        {%- set start = this.attributes.get('start') | float(none) -%}
        {%- set now_v = states('sensor.3d_printer_co2') | float(none) -%}
        {%- if trigger.id == 'end' and start is not none and now_v is not none and now_v >= start -%}
          {{ (now_v - start) | round(3) }}
        {%- else -%}
          {{ this.state if this.state | is_number else 0 }}
        {%- endif -%}
      attributes:
        start: >
          {{ states('sensor.3d_printer_co2') | float(none) if trigger.id == 'start' else none }}

# Running totals for the print in progress; 0 when nothing is printing.
- sensor:
    - name: "3D Printer Current Print Energy"
      unique_id: printer_3d_current_print_energy
      unit_of_measurement: kWh
      device_class: energy
      icon: mdi:printer-3d-nozzle
      state: >
        {%- set start = state_attr('sensor.3d_printer_last_print_energy', 'start') | float(none) -%}
        {%- set now_v = states('sensor.3d_printer_plug_energy') | float(none) -%}
        {{ (now_v - start) | round(3) if start is not none and now_v is not none and now_v >= start else 0 }}
    - name: "3D Printer Current Print Cost"
      unique_id: printer_3d_current_print_cost
      unit_of_measurement: USD
      icon: mdi:currency-usd
      state: >
        {%- set start = state_attr('sensor.3d_printer_last_print_cost', 'start') | float(none) -%}
        {%- set now_v = states('sensor.3d_printer_energy_cost') | float(none) -%}
        {{ (now_v - start) | round(2) if start is not none and now_v is not none and now_v >= start else 0 }}
