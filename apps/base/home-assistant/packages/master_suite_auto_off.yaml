# master_suite_auto_off.yaml — HA package: master suite lights off after 30 min without motion.
#
# GIT IS THE SOURCE OF TRUTH. Shipped in the hash-suffixed `home-assistant-packages`
# ConfigMap and mounted READ-ONLY as the /config/packages directory; configuration.yaml
# loads it via `homeassistant: packages: !include_dir_named packages` (asserted by the
# ensure-ha-config initContainer). A change here rolls the HA pod.
#
# Sensor: the Third Reality night light's PIR in the master bedroom ("Master Bedroom
# Motion"; device_class overridden to motion in scripts/home-assistant/registry-overrides.yaml).
#
# Turns off the bedroom, bathroom and closet lights plus the bathroom exhaust fan.
# Deliberately NOT touched:
# - fan.master_ceiling_fan — keeps running until someone turns it off.
# - light.0xb40ecfd7ce8c0000 — the night light itself is the house-status light.
# - light.outdoor_light — outdoor, owned by the sunset/sunrise automations.
#
# ⚠️ Only entities that are currently ON get a turn_off. light.master_ceiling_fan is a Bond
# RF light whose remote has a single light button: Bond sends that same TOGGLE code for
# "off", so an "off" to a light that is already off turns it ON while HA still shows it
# off (assumed_state). Happened 2026-10-22.
#
# ⚠️ The only sensor is in the BEDROOM. 30 min still in the bathroom or closet (a long
# bath) with nobody moving in the bedroom will turn the bathroom lights off.
# ─────────────────────────────────────────────────────────────────────────────

automation:
  - id: master_suite_lights_off_when_vacant
    alias: "Master suite — lights off after 30 min without motion"
    description: >-
      No motion in the master bedroom for 30 min: bedroom, bathroom and closet lights and
      the bathroom exhaust fan off. The ceiling fan keeps running.
    # restart: a 'vacant' trigger during the post-startup wait supersedes it.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.0xb40ecfd7ce8c0000_occupancy
        to: "off"
        for: "00:30:00"
        id: vacant
      # A `for:` trigger only fires on a transition, so a room that was already empty when
      # HA started would never be handled. Re-arm the 30 min from startup instead.
      - trigger: homeassistant
        event: start
        id: started
    actions:
      - if:
          - condition: trigger
            id: started
        then:
          - wait_for_trigger:
              - trigger: state
                entity_id: binary_sensor.0xb40ecfd7ce8c0000_occupancy
                to: "on"
            timeout: "00:30:00"
            continue_on_timeout: true
          # `stop`, not a condition: a failing condition inside `then:` only ends this
          # block and the lights went off anyway, on motion (2026-10-22).
          - if:
              - condition: template
                value_template: >-
                  {{ wait.trigger is not none
                     or not is_state('binary_sensor.0xb40ecfd7ce8c0000_occupancy', 'off') }}
            then:
              - stop: "Motion since startup — the normal 30 min trigger takes over."
      - variables:
          lights_on: >-
            {{ ['light.master_bedroom_darcy_bedside_light',
                'light.master_bedroom_preya_bedside_light',
                'light.master_ceiling_fan',
                'light.master_bathroom_fan_light',
                'light.master_bathroom_mirror_light_outlet',
                'light.master_closet_switch'] | select('is_state', 'on') | list }}
      - if:
          - condition: template
            value_template: "{{ lights_on | count > 0 }}"
        then:
          - action: light.turn_off
            target:
              entity_id: "{{ lights_on }}"
      - if:
          - condition: state
            entity_id: fan.master_bathroom_exhaust_fan
            state: "on"
        then:
          - action: fan.turn_off
            target:
              entity_id: fan.master_bathroom_exhaust_fan
