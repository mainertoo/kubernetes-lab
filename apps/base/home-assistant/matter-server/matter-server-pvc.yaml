apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matter-server
  # RETIRING 2026-10-02: matter-server runs on VM 702 (wiki apps/home-iot/matter-server).
  # Backup labels dropped first so Kyverno (synchronize) removes the generated
  # matter-server-backup RS/RD + volsync-matter-server secret cleanly; this PVC
  # is deleted in a follow-up PR. Kopia snapshots in Garage are kept.
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  # Stale ref left over from the volsync-v2/bootstrap variant's
  # one-time populator (the bootstrap RD itself is long gone).
  # dataSourceRef is immutable on a bound PVC, so we mirror it here
  # to keep Flux's dry-run happy. On a fresh cluster rebuild,
  # Kyverno's mutate rule (CREATE-only) swaps it for matter-server-backup
  # at admission before bind.
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: matter-server-bootstrap
  resources:
    requests:
      storage: 2Gi
