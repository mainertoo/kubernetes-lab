---
# Rewrites the HelmRelease's persistence.templates.name / persistence.packages.name to
# the hash-suffixed names of the generated `home-assistant-templates` /
# `home-assistant-packages` ConfigMaps, so editing either rolls the HA pod
# (mirrors the mosquitto pattern).
nameReference:
  - kind: ConfigMap
    version: v1
    fieldSpecs:
      - path: spec/values/persistence/templates/name
        kind: HelmRelease
      - path: spec/values/persistence/packages/name
        kind: HelmRelease
