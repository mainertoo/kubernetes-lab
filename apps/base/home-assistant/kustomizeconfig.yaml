---
# Rewrites the HelmRelease's persistence.templates.name to the hash-suffixed
# name of the generated `home-assistant-templates` ConfigMap, so editing
# home-assistant-templates.yaml rolls the HA pod (mirrors the mosquitto pattern).
nameReference:
  - kind: ConfigMap
    version: v1
    fieldSpecs:
      - path: spec/values/persistence/templates/name
        kind: HelmRelease
