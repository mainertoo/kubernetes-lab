apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wiki-js-ingressroute
  namespace: wiki-js
  # v2, frozen and scaled to 0 since the v3 cutover. wiki.lab and the homepage
  # tile moved to the v3 route (apps/base/wiki). To read v2 during rollback,
  # scale it back to 1 and use wiki-v2.lab.
spec:
  entryPoints:
    - websecure
    - web
  routes:
    - match: Host(`wiki-v2.lab.mainertoo.com`)
      kind: Rule
      # middlewares:
      #   - name: authentik-sso
      #     namespace: traefik-system
      services:
        # Service was renamed wiki-js-main → wiki-js when the legacy `db`
        # sidecar was removed from the HelmRelease in PR #306 (Phase 5b).
        # bjw-s app-template renders <release-name>-<service-key> when the
        # release has multiple services, but collapses to <release-name>
        # when only one service remains. Updating to the post-decom name.
        - name: wiki-js
          port: 3000