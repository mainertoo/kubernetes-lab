# Serves fluidd-config's config.json for fluidd.lab (see that ConfigMap).
# The ConfigMap is mounted as a directory (no subPath), so edits reach nginx
# without a restart.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluidd-config
  namespace: fluidd
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  maxHistory: 2

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  uninstall:
    keepHistory: false

  values:
    controllers:
      fluidd-config:
        containers:
          app:
            image:
              repository: nginxinc/nginx-unprivileged
              tag: 1.31-alpine
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /config.json
                    port: 8080
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: false
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi

    service:
      fluidd-config:
        controller: fluidd-config
        ports:
          http:
            port: 8080

    persistence:
      html:
        type: configMap
        name: fluidd-config
        globalMounts:
          - path: /usr/share/nginx/html
            readOnly: true
