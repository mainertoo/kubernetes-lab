# Fluidd's config.json for fluidd.lab only (Traefik routes /config.json here;
# everything else goes to the printer). Identical to the printer's copy except
# `endpoints`: with an endpoint listed, Fluidd saves it as the active printer
# on first load and connects with its normal socket client. Without it, Fluidd
# first probes the page origin with a 1.2 s websocket timeout (src/init.ts),
# which a phone on a relayed tailnet path doesn't meet, and it then shows
# "Add printer" (whose own 3 s check fails the same way). Kept in the cluster so
# Valve Oil updates on the printer can't overwrite it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluidd-config
  namespace: fluidd
data:
  config.json: |
    {
      "blacklist": [
        "fluidd.xyz",
        "fluidd.net"
      ],
      "endpoints": [
        "https://fluidd.lab.mainertoo.com"
      ],
