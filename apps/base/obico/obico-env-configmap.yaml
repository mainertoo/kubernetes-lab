# Non-secret Obico server settings, shared by the web, tasks and init
# containers. DATABASE_URL and DJANGO_SECRET_KEY come from Secrets (see
# obico-release.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: obico-env
  namespace: obico
data:
  TZ: America/Los_Angeles
  DEBUG: "False"
  REDIS_URL: redis://obico-redis:6379
  ML_API_HOST: http://obico-ml-api:3333
  INTERNAL_MEDIA_HOST: http://obico:3334
  # Served over HTTPS by Traefik; Django rejects HTTPS form posts (login,
  # admin) from origins not listed here.
  SITE_USES_HTTPS: "True"
  SITE_IS_PUBLIC: "False"
  CSRF_TRUSTED_ORIGINS: '["https://obico.lab.mainertoo.com"]'
  ACCOUNT_ALLOW_SIGN_UP: "False"
  SOCIAL_LOGIN: "False"
  # OctoPrint tunnel ports are unused (the printer is Klipper/Moonraker).
  OCTOPRINT_TUNNEL_PORT_RANGE: "0-0"
