apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Staging-only test bed for adopting VolSync (Kopia) backups into kopiur.
# Step 1 (PR #2460, #2469): three PVCs carrying the `backup` labels, so the
# Kyverno policies generated the per-PVC Secret, ReplicationSource and
# ReplicationDestination, and VolSync backed them up to the staging-only
# Garage bucket volsync-staging.
# Step 2 (PR #2471, #2473): the `backup` label is gone and kopiur policies
# (volsync-test-kopiur.yaml) continue the same history through
# ClusterRepository `volsync`.
# Step 3 (this state): VolSync's KopiaMaintenance is removed and kopiur
# maintains the repository. The PVCs name a kopiur Restore as their data
# source and are create-only for Flux (see the annotation on each).
#
# No `namespace:` here and no targetNamespace on the Flux Kustomization;
# every object sets its own namespace.
resources:
  - volsync-test-namespace.yaml
  - volsync-test-rbd-pvc.yaml
  - volsync-test-cephfs-pvc.yaml
  - volsync-test-ds-pvc.yaml
  - volsync-test-release.yaml
  - volsync-test-kopiur.yaml
