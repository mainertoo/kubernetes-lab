# Shaped like the 35 production PVCs that name a VolSync
# ReplicationDestination as their data source. dataSourceRef cannot be
# changed once the PVC is bound, which is the problem the kopiur cutover has
# to solve; this volume is where that cutover is rehearsed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: volsync-test-ds
  namespace: volsync-test
  annotations:
    # Create-only: Flux creates this PVC when it is missing and never
    # updates it. dataSourceRef below differs from the live, bound PVC
    # (immutable), and without this every reconcile would fail on it.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  storageClassName: ceph-rbd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # Filled by kopiur from the latest backup when the PVC is created. That
  # backup may be one VolSync made: the policy continues VolSync's history.
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: volsync-test-ds
