apiVersion: v1
kind: ConfigMap
metadata:
  name: openmrs-gateway-nginx
  namespace: openmrs
data:
  # Upstream's gateway config, taken verbatim from tag 3.7.1 of
  # openmrs/openmrs-distro-referenceapplication (gateway/default.conf.template)
  # — the SAME ref as the pinned gateway image — with exactly three edits:
  #
  # 1. `resolver 127.0.0.11` -> `resolver ${NGINX_LOCAL_RESOLVERS}`.
  #    127.0.0.11 is Docker's embedded DNS and does not exist in a Pod. The
  #    placeholder is upstream's own later fix (present on main), backported
  #    here; it is filled in at start-up from /etc/resolv.conf by
  #    /docker-entrypoint.d/15-local-resolvers.envsh, which ships in the
  #    nginx:1.31-alpine BASE image. That script exits early unless
  #    NGINX_ENTRYPOINT_LOCAL_RESOLVERS is set — 3.7.1's gateway Dockerfile does
  #    not set it (main does), so the HelmRelease sets it on the container. Miss
  #    that and nginx dies at boot with:
  #      [emerg] host not found in resolver "${NGINX_LOCAL_RESOLVERS}"
  #
  # 2+3. The two upstreams become cluster FQDNs. The config resolves them at
  #    request time (`set $var; proxy_pass $var`) through nginx's own resolver,
  #    which does NOT apply the search domains from /etc/resolv.conf. Under
  #    Compose the embedded DNS answers bare service names; against CoreDNS a
  #    bare `frontend` is NXDOMAIN and every request 502s.
  #
  # The `grafana` upstream is left exactly as upstream ships it — no such
  # Service exists here, and it is only resolved lazily on a request to
  # /grafana, so it costs nothing at start-up.
  #
  # NOTE this is pinned to 3.7.1. On a version bump, re-diff against that tag's
  # template and re-apply these three edits.
  #
  # The container mounts this at /etc/nginx/conf-templates/, NOT
  # /etc/nginx/templates/ — the image's entrypoint copies between the two, and
  # copying onto a read-only ConfigMap mount would abort the container.
  #
  # ${FRAME_ANCESTORS} and ${NGINX_LOCAL_RESOLVERS} are deliberately single-`$`:
  # they are substituted at runtime by nginx's envsubst entrypoint. They would
  # need `$$` escaping only if the Flux Kustomization that renders this used
  # postBuild.substitute — apps/staging/openmrs does not.
  default.conf.template: |
    map $request_uri $csp_header {
      default "default-src 'self' 'unsafe-inline' 'unsafe-eval' localhost localhost:*; base-uri 'self'; font-src 'self'; img-src 'self' data:; frame-ancestors 'self' ${FRAME_ANCESTORS};";
      "~^/openmrs/(?:admin|dictionary|module|patientDashboard.form)/" "default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; base-uri 'self'; font-src 'self'; frame-ancestors 'self';";
      "~^/openmrs/owa" "default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; base-uri 'self'; font-src 'self' data:; img-src 'self' data:; frame-ancestors 'self';";
    }

    map $http_x_forwarded_proto $forwarded_proto {
      "~.*" $http_x_forwarded_proto;
      default    $scheme;
    }

    map $http_x_real_ip $forwarded_ip {
      "~.*"  $http_x_real_ip;
      default $remote_addr;
    }

    server {
      listen [::]:80;
      listen       80;

      add_header X-XSS-Protection "1; mode=block";
      add_header Content-Security-Policy $csp_header;
      add_header X-Content-Type-Options nosniff;

      proxy_set_header      HOST $host;
      proxy_set_header      X-Forwarded-Proto $forwarded_proto;
      proxy_set_header      X-Real-IP $forwarded_ip;
      proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version    1.1;

      gzip on;
      gzip_vary on;
      # 1 KiB
      gzip_min_length 1024;
      gzip_proxied any;
      gzip_http_version 1.0;
      gzip_types  font/eot
                  font/otf
                  font/ttf
                  image/svg+xml
                  text/css
                  text/html
                  text/javascript
                  text/plain
                  text/xml
                  application/atom+xml
                  application/geo+json
                  application/importmap+json
                  application/javascript
                  application/x-javascript
                  application/json
                  application/ld+json
                  application/fhir+json
                  application/fhir+xml
                  application/manifest+json
                  application/rdf+xml
                  application/rss+xml
                  application/xhtml+xml
                  application/xml;

      # all redirects are relative to the gateway
      absolute_redirect off;

      resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;

      location /openmrs/spa/ {
        set $frontend http://openmrs-frontend.openmrs.svc.cluster.local;
        rewrite ^/openmrs/spa/(.*) /$1 break;
        proxy_pass $frontend;
      }

      location /openmrs {
        set $backend http://openmrs-backend.openmrs.svc.cluster.local:8080;
        proxy_read_timeout 300s;
        proxy_pass $backend;
      }

      location /grafana {
        set $grafana http://grafana:3000;
        proxy_read_timeout 300s;
        proxy_pass $grafana;
      }

      location = /openmrs/spa/ {
        return 301 /openmrs/spa/home;
      }

      location = /openmrs/spa {
        return 301 /openmrs/spa/home;
      }

      location = / {
        return 301 /openmrs/spa/home;
      }
    }
