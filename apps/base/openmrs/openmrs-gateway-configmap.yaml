apiVersion: v1
kind: ConfigMap
metadata:
  name: openmrs-gateway-nginx
  namespace: openmrs
data:
  # Upstream's gateway config, copied verbatim from
  # openmrs/openmrs-distro-referenceapplication gateway/default.conf.template,
  # with ONE change: the two upstreams are FQDNs instead of the bare Docker
  # Compose service names `frontend` and `backend`.
  #
  # Why the change is required: the config resolves its upstreams at request
  # time (`set $frontend ...; proxy_pass $frontend;`) via nginx's own `resolver`,
  # and nginx's resolver does NOT apply the search domains from
  # /etc/resolv.conf. Under Docker Compose the embedded DNS answers bare service
  # names, so upstream works as-is; against CoreDNS a bare `frontend` is NXDOMAIN
  # and every request 502s. The `grafana` upstream is left as upstream ships it —
  # no such Service exists here, and because it is only resolved lazily on a
  # request to /grafana it costs nothing at startup.
  #
  # The container mounts this at /etc/nginx/conf-templates/, NOT
  # /etc/nginx/templates/ — the image's entrypoint copies between the two, and
  # copying onto a read-only ConfigMap mount would abort the container.
  #
  # ${FRAME_ANCESTORS} and ${NGINX_LOCAL_RESOLVERS} are deliberately single-`$`:
  # they are substituted at runtime by nginx's envsubst entrypoint. They would
  # need `$$` escaping only if the Flux Kustomization that renders this used
  # postBuild.substitute — apps/staging/openmrs does not.
  default.conf.template: |
    map $request_uri $csp_header {
      default "default-src 'self' 'unsafe-inline' 'unsafe-eval' localhost localhost:*; base-uri 'self'; font-src 'self'; img-src 'self' data:; object-src 'self' blob:; frame-ancestors 'self' ${FRAME_ANCESTORS};";
      "~^/openmrs/(?:admin|dictionary|module|patientDashboard.form)/" "default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; base-uri 'self'; font-src 'self'; frame-ancestors 'self';";
      "~^/openmrs/owa" "default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; base-uri 'self'; font-src 'self' data:; img-src 'self' data:; frame-ancestors 'self';";
    }

    map $http_x_forwarded_proto $forwarded_proto {
      "~.*" $http_x_forwarded_proto;
      default    $scheme;
    }

    map $http_x_real_ip $forwarded_ip {
      "~.*"  $http_x_real_ip;
      default $remote_addr;
    }

    server {
      listen [::]:80;
      listen       80;

      add_header X-XSS-Protection "1; mode=block";
      add_header Content-Security-Policy $csp_header;
      add_header X-Content-Type-Options nosniff;

      proxy_set_header      HOST $host;
      proxy_set_header      X-Forwarded-Proto $forwarded_proto;
      proxy_set_header      X-Real-IP $forwarded_ip;
      proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version    1.1;

      gzip on;
      gzip_vary on;
      # 1 KiB
      gzip_min_length 1024;
      gzip_proxied any;
      gzip_http_version 1.0;
      gzip_types  font/eot
                  font/otf
                  font/ttf
                  image/svg+xml
                  text/css
                  text/html
                  text/javascript
                  text/plain
                  text/xml
                  application/atom+xml
                  application/geo+json
                  application/importmap+json
                  application/javascript
                  application/x-javascript
                  application/json
                  application/ld+json
                  application/fhir+json
                  application/fhir+xml
                  application/manifest+json
                  application/rdf+xml
                  application/rss+xml
                  application/xhtml+xml
                  application/xml;

      # all redirects are relative to the gateway
      absolute_redirect off;

      resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;

      location /openmrs/spa/ {
        set $frontend http://openmrs-frontend.openmrs.svc.cluster.local;
        rewrite ^/openmrs/spa/(.*) /$1 break;
        proxy_pass $frontend;
      }

      location /openmrs {
        set $backend http://openmrs-backend.openmrs.svc.cluster.local:8080;
        proxy_read_timeout 300s;
        proxy_pass $backend;
      }

      location /grafana {
        set $grafana http://grafana:3000;
        proxy_read_timeout 300s;
        proxy_pass $grafana;
      }

      location = /openmrs/spa/ {
        return 301 /openmrs/spa/home;
      }

      location = /openmrs/spa {
        return 301 /openmrs/spa/home;
      }

      location = / {
        return 301 /openmrs/spa/home;
      }
    }
