apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openmrs-data
  # OpenMRS' OMRS_HOME data dir (/openmrs/data): runtime properties written at
  # install time, complex_obs (uploaded attachments), the Lucene search index and
  # the ActiveMQ store. Modules/OWAs/configuration under it are wiped and
  # re-populated from the image on every start, so only the first three matter.
  # THROWAWAY, no backup labels.
spec:
  storageClassName: ceph-rbd
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 8Gi
