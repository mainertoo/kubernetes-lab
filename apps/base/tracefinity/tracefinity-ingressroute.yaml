apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tracefinity-ingressroute
  namespace: tracefinity
  annotations:
    gethomepage.dev/href: "https://tracefinity.lab.mainertoo.com"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Tracefinity"
    gethomepage.dev/description: "Gridfinity bins from tool photos"
    gethomepage.dev/app: tracefinity
    gethomepage.dev/group: "Apps"
    gethomepage.dev/icon: "sh-tracefinity.png"
spec:
  entryPoints:
    - websecure
    - web
  routes:
    - match: Host(`tracefinity.lab.mainertoo.com`)
      kind: Rule
      middlewares:
        - name: authentik-sso
          namespace: traefik-system
      services:
        - name: tracefinity
          port: 3000
          scheme: http
  tls: {}
