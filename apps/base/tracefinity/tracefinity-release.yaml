apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tracefinity
  namespace: tracefinity
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  maxHistory: 2

  # image is ~2.5 GB and all tracing models load at startup
  timeout: 15m

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  uninstall:
    keepHistory: false

  values:
    controllers:
      tracefinity:
        strategy: Recreate # RWO /app/storage PVC
        containers:
          app:
            image:
              repository: ghcr.io/tracefinity/tracefinity
              tag: 0.10.0
            env:
              - name: TZ
                value: America/Los_Angeles
              # Local CPU tracing only — no photos leave the cluster.
              # BiRefNet Lite (best on shiny tools) + IS-Net (fast fallback).
              - name: TRACERS
                value: birefnet-lite,isnet
              - name: TRACEFINITY_ONNX_PROVIDER
                value: cpu
              # Authentik forward-auth fronts the IngressRoute; app login off.
              # Single shared "default" library.
              - name: AUTH_MODE
                value: open
              # Automatic tool naming via the DGX Spark vLLM (Qwen3.6, vision).
              # The "openrouter" provider is any OpenAI-compatible endpoint.
              # ⚠️ OPENROUTER_API_KEY also enables the gemini tracer on the same
              # URL — TRACERS above is pinned so it is never offered (Spark
              # can't return mask images).
              - name: TOOL_LABEL_PROVIDER
                value: openrouter
              - name: OPENROUTER_URL
                value: http://spark-llm.spark-egress.svc.cluster.local:8000/v1/chat/completions
              - name: OPENROUTER_LABEL_MODEL
                value: nvidia/Qwen3.6-35B-A3B-NVFP4
              # vLLM on the Spark has no auth; the namer just requires a
              # non-empty key. Not a secret.
              - name: OPENROUTER_API_KEY
                value: unused
            # uvicorn binds 127.0.0.1:8000 (unreachable by kubelet), and nginx
            # on :3000 only proxies /api/ — so probe /api/version through nginx,
            # which exercises nginx + backend end to end.
            # All models load at startup — give it a generous startup window.
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 3000
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 3000
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
            # BiRefNet Lite on CPU: ONNX Runtime's arena keeps the first
            # inference's allocation (~8.3 GiB resident after one trace, never
            # released), and a retrace needs headroom ON TOP of that — 10Gi
            # OOMKilled on the second trace (2026-09-28). Request matches the
            # post-first-trace resident set so the scheduler places it honestly.
            resources:
              requests:
                cpu: 100m
                memory: 8Gi
              limits:
                memory: 16Gi

    service:
      # key == release name ⇒ Service renders as bare "tracefinity"
      # (matches the IngressRoute + Gatus internal target).
      tracefinity:
        controller: tracefinity
        ports:
          http:
            port: 3000

    persistence:
      config:
        existingClaim: tracefinity-config
        globalMounts:
          - path: /app/storage
      # Model weights download here on first trace; reproducible, so keep
      # them out of the backed-up PVC.
      models:
        type: emptyDir
        sizeLimit: 2Gi
        globalMounts:
          - path: /app/.u2net
