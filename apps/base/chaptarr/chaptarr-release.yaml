apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app chaptarr
  namespace: chaptarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2

  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false

  values:
    controllers:
      chaptarr:
        type: deployment
        replicas: 1
        containers:
          app:
            # Community-maintained image — Chaptarr is a Readarr fork that handles
            # audiobooks + ebooks in one instance. No official/GitHub image yet,
            # only this Docker Hub build. It now publishes numbered tags (0.9.x;
            # `main` == `latest` == the newest one), so pin a version: the old
            # `latest@sha256` pin was ignored by Renovate's moving-tag rule and sat
            # on a 2026-06 build for 5 months.
            image:
              repository: robertlordhood/chaptarr
              tag: "0.9.1000@sha256:bacb27cc04abe1900412df45ad5ad4e392368fe3e783012824b2ad768c72daa1"
            # TEMPORARY workaround (2026-11-25) for LP#2172640: on Ubuntu kernels
            # >= 7.0.0-42 containerd's AppArmor profile blocks self-signals, so the
            # entrypoint's `gosu ubuntu` spins forever at 100% CPU and the app never
            # starts (pod showed 1/1 Running for 4 days with nothing on :8789).
            # Same fix as the staging EMR MariaDBs (#2422); remove once K3s ships a
            # containerd with containerd#14487 (the update-gh skill flags it).
            securityContext:
              appArmorProfile:
                type: Unconfined
            env:
              TZ: "America/Los_Angeles"
              # Servarr defaults: PUID/PGID drive file ownership on /config.
              PUID: "1000"
              PGID: "1000"
            # Readiness = a TCP connect on 8789: with no probes at all, a hung start
            # (see AppArmor note above) looked healthy for days. Liveness/startup
            # stay off so a slow first boot or DB migration isn't killed mid-way.
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8789
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 4
              startup:
                enabled: false

    service:
      app:
        enabled: true
        controller: chaptarr
        ports:
          http:
            # Chaptarr listens on 8789 (the fork bumped off Readarr's 8787 —
            # confirmed via the container's "Now listening on: http://[::]:8789").
            port: 8789

    persistence:
      config:
        existingClaim: chaptarr
        globalMounts:
          - path: /config
      # Throwaway eval library on the isolated staging-rbd pool (chaptarr-media
      # PVC). Holds COPIES of the audiobook (ABS/QNAS) + ebook (CWA/calibre)
      # libraries — Chaptarr only ever touches copies, never the originals. In
      # the Chaptarr UI, add root folders pointing at /media/audiobooks and
      # /media/ebooks. No downloads volume — eval is import/metadata only.
      media:
        existingClaim: chaptarr-media
        globalMounts:
          - path: /media
