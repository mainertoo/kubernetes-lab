apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: code-server
resources:
  # PVC carries the backup labels; Kyverno generates its VolSync objects
  # (docs/label-driven-backups.md).
  - code-server-pvc.yaml
  - code-server-release.yaml
  - code-server-ingressroute.yaml
  - code-server-namespace.yaml
  - code-server-secret.sops.yaml