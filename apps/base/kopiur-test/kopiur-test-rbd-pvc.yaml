apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kopiur-test-rbd
spec:
  storageClassName: ceph-rbd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # Filled by kopiur from the latest backup when the PVC is created.
  # Immutable once the PVC is bound.
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: kopiur-test-rbd
