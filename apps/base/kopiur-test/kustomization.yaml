apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kopiur-test
# Staging-only test bed for the kopiur migration: one Ceph RBD volume and
# one CephFS volume, each with a backup policy, an hourly schedule and a
# restore-on-create populator. No `backup:` labels on the PVCs: those would
# trigger the VolSync Kyverno policies.
resources:
  - kopiur-test-namespace.yaml
  - kopiur-test-backup.yaml
  - kopiur-test-rbd-pvc.yaml
  - kopiur-test-cephfs-pvc.yaml
  - kopiur-test-release.yaml
