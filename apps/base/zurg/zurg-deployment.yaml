apiVersion: apps/v1
kind: Deployment
metadata:
  name: zurg
  namespace: zurg
  labels:
    app: zurg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zurg
  template:
    metadata:
      labels:
        app: zurg
    spec:
      imagePullSecrets:
        - name: zurg-ghcr-pull
      initContainers:
        - name: merge-config
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Merging config files..."
              cat /zurgsecret/secret.yml > /config/config.yml
              cat /zurgconfig/config.yml >> /config/config.yml
          volumeMounts:
            - name: zurg-config
              mountPath: /zurgconfig
            - name: zurg-secret
              mountPath: /zurgsecret
            - name: merged-config
              mountPath: /config
      containers:
        - name: zurg
          # Tracks the NIGHTLY channel. There is no rolling `:nightly` tag —
          # nightlies are published as dated tags (2026.08.13.0235-nightly) and
          # `:latest` is repointed at the newest one (verified 2026-08-12:
          # :latest and 2026.08.13.0235-nightly both resolve to sha256:6751ecc1…).
          # So an UNPINNED :latest is the only way to follow nightly automatically.
          #
          # Deliberately not digest-pinned: Renovate has no ghcr hostRules, so it
          # cannot see this private package and would never raise a bump PR — a
          # pin would mean bumping by hand every day at the upstream cadence.
          # Trade-off accepted: with imagePullPolicy Always, each pod restart
          # pulls whatever nightly is current, so an untested build can land on a
          # restart and the repo does not record which digest is deployed.
          image: ghcr.io/debridmediamanager/zurg:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: merged-config
              subPath: config.yml
              mountPath: /app/config.yml
      volumes:
        - name: zurg-config
          configMap:
            name: zurg-config
        - name: zurg-secret
          secret:
            secretName: zurg-secret
        - name: merged-config
          emptyDir: {}
      restartPolicy: Always