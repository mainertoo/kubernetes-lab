apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-media
  namespace: prod-restore-test
  annotations:
    # Create-only for Flux: dataSourceRef cannot change on a bound PVC.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  storageClassName: cephfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: authentik-media
