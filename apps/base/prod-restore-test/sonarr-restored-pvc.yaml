apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-restored
  namespace: prod-restore-test
  annotations:
    # Create-only for Flux: dataSourceRef cannot change on a bound PVC.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  storageClassName: ceph-rbd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: sonarr-restored
