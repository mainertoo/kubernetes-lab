# One Restore per production volume, selected by the identity VolSync wrote
# (username = <ReplicationSource name>, hostname = namespace). No
# SnapshotPolicy: nothing here backs anything up.
#
# onMissingSnapshot: Fail on all of them. An empty volume would hide a
# failure to find the backup, which is the thing under test.
---
# vaultwarden: SQLite, runs as root in production
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: vaultwarden
  namespace: prod-restore-test
spec:
  # Root, with the capabilities to set file ownership, because production
  # runs this app as root and the files are root-owned.
  mover:
    privilegedMode: true
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
  credentialProjection:
    enabled: true
  repository:
    kind: ClusterRepository
    name: production-ro
  source:
    identity:
      username: vaultwarden-backup
      hostname: vaultwarden
  target:
    populator: {}
  policy:
    onMissingSnapshot: Fail
    waitTimeout: 10m
---
# home-assistant: about 10 GiB, runs as root in production
apiVersion: kopiur.home-operations.com/v1alpha1
