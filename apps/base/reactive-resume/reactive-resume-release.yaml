apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reactive-resume
  namespace: reactive-resume
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  maxHistory: 2

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  uninstall:
    keepHistory: false

  values:
    controllers:
      reactive-resume:
        containers:
          app:
            image:
              repository: ghcr.io/reactive-resume/reactive-resume
              tag: v6.1.0
            env:
              - name: TZ
                value: America/Los_Angeles
              # Public origin — drives auth callbacks, secure cookies and the
              # trusted origin. Must match the IngressRoute host exactly.
              - name: APP_URL
                value: https://rx-resume.lab.mainertoo.com
              # CNPG-generated connection string
              # (postgresql://resume:<pw>@reactive-resume-db-rw:5432/resume).
              - name: DATABASE_URL
                valueFrom:
                  secretKeyRef:
                    name: reactive-resume-db-app
                    key: uri
              # Uploads (profile pictures, PDF cache) on the backed-up PVC.
              # No S3 vars set ⇒ local storage backend.
              - name: STORAGE_BACKEND
                value: local
              # Native OIDC against Authentik (better-auth "custom" provider).
              # Callback: https://rx-resume.lab.mainertoo.com/api/auth/callback/custom
              # Internal-only app ⇒ .lab issuer. OAUTH_CLIENT_ID/SECRET come
              # from reactive-resume-secret (envFrom below).
              - name: OAUTH_PROVIDER_NAME
                value: Authentik
              - name: OAUTH_DISCOVERY_URL
                value: https://authentik.lab.mainertoo.com/application/o/reactive-resume/.well-known/openid-configuration
              - name: OAUTH_SCOPES
                value: openid profile email
              # SSO-only: no SMTP here, so email/password verification and
              # resets could never complete anyway. Signups stay open so the
              # first Authentik login can create its account.
              - name: FLAG_DISABLE_EMAIL_AUTH
                value: "true"
            envFrom:
              - secretRef:
                  name: reactive-resume-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 384Mi
              limits:
                memory: 1Gi
        pod:
          # Image's entrypoint only needs root to chown /app/data (Cloudron);
          # running as node (1000) skips that per upstream docs. fsGroup makes
          # the root-owned ceph-rbd volume writable.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

    service:
      # Key == release name ⇒ Service renders as bare `reactive-resume`,
      # matching the IngressRoute and the Gatus internal check.
      reactive-resume:
        controller: reactive-resume
        ports:
          http:
            port: 3000

    persistence:
      data:
        existingClaim: reactive-resume-data
        globalMounts:
          - path: /app/data
