apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wiki
# Wiki.js 3.x (docs/plans/wiki-js-v3-migration.md; the 2.x install in namespace
# wiki-js was retired 2026-11-11). Namespace comes from the DB layer.
# No PVC: v3 keeps pages and assets in Postgres, and git storage works from a
# scratch checkout, so /wiki/data is an emptyDir.
resources:
  - wiki-secret.sops.yaml
  # Git storage deploy key: DR/rotation copy only, deliberately not mounted
  # (the live key is in the storage config in the DB).
  - wiki-git-deploy-key.sops.yaml
  - wiki-release.yaml
  - wiki-ingressroute.yaml
