apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wiki-ingressroute
  namespace: wiki
  annotations:
    gethomepage.dev/href: "https://wiki.lab.mainertoo.com"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Wiki.js"
    gethomepage.dev/description: "Personal knowledge base"
    gethomepage.dev/app: wiki
    gethomepage.dev/group: "Apps"
    gethomepage.dev/icon: "sh-wiki-js.svg"
spec:
  entryPoints:
    - websecure
    - web
  routes:
    - match: Host(`wiki.lab.mainertoo.com`)
      kind: Rule
      services:
        - name: wiki
          port: 3000
          scheme: http
  tls: {}
