---
# Flux Kustomization for Wiki.js 3.x, serving wiki.lab.mainertoo.com since the
# 2026-11-11 cutover. Wiki.js 2.x (namespace wiki-js) was retired the same day.
#
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app wiki
  namespace: flux-system
spec:
  interval: 1h
  path: ./apps/base/wiki
  targetNamespace: wiki
  prune: true
  retryInterval: 2m
  timeout: 5m
  wait: false
  dependsOn:
    - name: wiki-db-cnpg
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../components/gatus/internal
    - ../../../components/gatus/external
  postBuild:
    substitute:
      APP: *app
      SUBDOMAIN: wiki
      GATUS_DOMAIN: lab.mainertoo.com
      GATUS_PORT: "3000"
      GATUS_PATH: /_ready
