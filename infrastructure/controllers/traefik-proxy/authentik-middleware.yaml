apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-sso
  namespace: traefik-system
spec:
  forwardAuth:
    # Same outpost endpoint you're already using in file-provider
    address: "http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik"
    trustForwardHeader: true
    # Traefik >= 3.6.9 field; 3.7 logs "maxResponseBodySize is not configured" on every
    # config build (~15/min/pod) when unset. Authentik's forward-auth replies are small
    # redirects/401s, so 1 MiB is generous while still bounding memory.
    maxResponseBodySize: 1048576
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
      - Authorization
    authResponseHeadersRegex: "^(X-authentik-|Set-Cookie|Authorization)$"