apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-proxy
  namespace: traefik-system
spec:
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik-proxy
        namespace: traefik-system
      version: "42.4.1"
  # Keep the Traefik CRDs in step with the chart. Flux's default never upgrades
  # CRDs, so ours were still the 2025-11-19 originals (no 3.6.9+ fields).
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: traefik-values
      valuesKey: values.yaml
      optional: true
  interval: 1h
  releaseName: traefik-proxy
  targetNamespace: traefik-system