# Traefik image: chart default (appVersion). The old `image.tag: "v3.6.7"` pin
# (2026-01) had no `repository:` key, so Renovate never saw it and Traefik
# stayed on 3.6.7 for 10 months while the chart moved on. Unpinned 2026-11-17
# after a staging canary (#2284): chart bumps (Renovate) now carry the version.

deployment:
  replicas: 3
  additionalVolumes:
    - name: traefik-file-provider-pve
      configMap:
        name: traefik-file-provider-pve

# Pin the LoadBalancer address. MetalLB had auto-assigned it, so recreating the
# Service or rebuilding the cluster could have handed out a different one.
# AdGuard rewrites *.lab.mainertoo.com to this address and the UniFi firewall
# rules reference it.
service:
  annotations:
    metallb.io/loadBalancerIPs: "192.168.90.180"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-proxy-traefik-system

# Persistence is unused: TLS is provided by cert-manager-issued
# Secrets referenced via IngressRoute `tls.secretName`, not by an
# in-Traefik ACME resolver. The previous local-path PVC also
# pinned Traefik to a single node, defeating any HA scale-out.
persistence:
  enabled: false

ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - websecure
    matchRule: Host(`traefik.lab.mainertoo.com`) && PathPrefix(`/dashboard`)
    tls:
      secretName: wildcard-lab-mainertoo-com-tls

providers:
  kubernetesCRD:
    allowCrossNamespace: true

ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

additionalArguments:
  - "--providers.file.directory=/config"
  - "--providers.file.watch=true"

additionalVolumeMounts:
  - name: traefik-file-provider-pve
    mountPath: /config
    readOnly: true
