apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# CEL replacements for the LEGACY ClusterPolicy
# ../policies/volsync-pvc-backup-restore-kopia.yaml, applied at the Kyverno
# 1.20 upgrade (docs/plans/kyverno-cel-migration.md): Kyverno 1.19.2's
# GeneratingPolicy can't safely sync (kyverno#16747, fixed in 1.20).
