apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# CEL backup/restore policies that replaced the legacy ClusterPolicy
# volsync-pvc-backup-restore-kopia at the Kyverno 1.20 upgrade
# (docs/plans/kyverno-cel-migration.md). Included from ../policies, so they
# deploy with the kyverno-policies Kustomization. tests/ holds the offline
# `kyverno test` suite and is not part of the build.
resources:
  - volsync-pvc-restore-datasource.yaml
  - volsync-pvc-restore-checks.yaml
  - volsync-pvc-backup-objects.yaml
