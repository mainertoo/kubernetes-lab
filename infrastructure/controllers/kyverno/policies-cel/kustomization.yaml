apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# CEL replacements for the legacy ClusterPolicies in ../policies
# (docs/plans/kyverno-cel-migration.md). Not deployed to production yet:
# only staging's rehearsal includes this directory. tests/ holds the offline
# `kyverno test` suite and is not part of the build.
resources:
  - volsync-pvc-engine-required.yaml
  - volsync-mover-jitter.yaml
  - volsync-pvc-restore-datasource.yaml
  - volsync-pvc-restore-checks.yaml
  - volsync-pvc-backup-objects.yaml
