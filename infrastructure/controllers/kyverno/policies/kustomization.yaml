apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Mover start-time jitter (CEL MutatingPolicy).
  - kyverno-volsync-jitter.yaml
  - volsync-policy-rbac.yaml
  # Engine-label admission gate (CEL ValidatingPolicy, Deny). Allowed: [kopia].
  - volsync-pvc-engine-required.yaml
  # Backup/restore policies (CEL, replaced the legacy ClusterPolicy
  # volsync-pvc-backup-restore-kopia at the Kyverno 1.20 upgrade):
  # restore-on-rebuild dataSourceRef, audit checks, and the GeneratingPolicy
  # for each backup PVC's Kopia Secret / ReplicationSource /
  # ReplicationDestination. See docs/plans/kyverno-cel-migration.md.
  - ../policies-cel
