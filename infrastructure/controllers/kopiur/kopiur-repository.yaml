apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kopiur
  namespace: kopiur-system
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # kopiur is alpha (API kopiur.home-operations.com/v1alpha1). Read
    # https://kopiur.home-operations.com/upgrade/ before taking a bump:
    # 0.5 -> 0.6 was a breaking CRD change.
    tag: 0.11.2
  url: oci://ghcr.io/home-operations/charts/kopiur
  # The published chart is cosign-signed (keyless) and pins the controller,
  # webhook and mover images by digest.
  # Keyless verification needs the signer named: Flux refuses a bare
  # `provider: cosign` here ("can't verify identities without providing at
  # least one identity"). The chart is signed by kopiur's release workflow.
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/home-operations/kopiur/\.github/workflows/release\.yaml@.+$
