apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cephfs-backingsnapshot
  # CephFS shallow / snapshot-backed volumes: a ReadOnlyMany PVC created
  # from a cephfs VolumeSnapshot on this class is a zero-copy read-only
  # mount of the snapshot, with no subvolume clone. kopiur stages backups
  # on it via SnapshotPolicy spec.staging.storageClassName.
  # `pool` must be omitted: no subvolume is created.
provisioner: cephfs.csi.ceph.com
parameters:
  clusterID: 2b142655-7791-4f14-8934-0ea16121b652
  csi.storage.k8s.io/node-stage-secret-name: cephfs-secret
  csi.storage.k8s.io/node-stage-secret-namespace: ceph-csi
  csi.storage.k8s.io/provisioner-secret-name: cephfs-secret
  csi.storage.k8s.io/provisioner-secret-namespace: ceph-csi
  fsName: k3s-fs
  monitors: 192.168.99.12:6789,192.168.99.13:6789,192.168.99.14:6789
  backingSnapshot: "true"
reclaimPolicy: Delete
volumeBindingMode: Immediate
