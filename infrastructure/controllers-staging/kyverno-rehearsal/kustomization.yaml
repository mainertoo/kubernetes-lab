apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Rehearsal fixtures for the Kyverno ClusterPolicy -> CEL migration
# (docs/plans/kyverno-cel-migration.md, Phase 0). Mirrors what production's
# VolSync policy depends on:
#   - pvc-plumber-stub: answers /exists/<ns>/<pvc> at the same in-cluster
#     URL as production's oracle, with canned answers chosen by PVC name
#   - volsync-kopia-shared-base: same name/keys as production. Since the
#     VolSync adoption test (2026-11-26) it holds real credentials for the
#     staging-only Garage bucket volsync-staging, not dummy values.
#   - kyverno-rehearsal namespace for scratch PVCs
# The volsync-system Namespace comes from ../../controllers/volsync/app.
resources:
  - pvc-plumber-stub.yaml
  - volsync-kopia-shared-base.sops.yaml
  - rehearsal-namespace.yaml
configMapGenerator:
  - name: pvc-plumber-stub
    namespace: volsync-system
    files:
      - stub.py
generatorOptions:
  disableNameSuffixHash: true
