# Named and placed like production's oracle (Service pvc-plumber, namespace
# volsync-system, port 80) so the policies call the same URL on both clusters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvc-plumber
  namespace: volsync-system
  labels:
    app.kubernetes.io/name: pvc-plumber-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pvc-plumber-stub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pvc-plumber-stub
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: stub
          image: docker.io/library/python:3.13-alpine
          command: ["python3", "-u", "/stub/stub.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: stub
              mountPath: /stub
              readOnly: true
      volumes:
        - name: stub
          configMap:
            name: pvc-plumber-stub
---
apiVersion: v1
kind: Service
metadata:
  name: pvc-plumber
  namespace: volsync-system
spec:
  selector:
    app.kubernetes.io/name: pvc-plumber-stub
  ports:
    - name: http
      port: 80
      targetPort: http
