apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Bare-minimum controller set for the staging cluster. Staging is a
# testbed, not a clone — add specific controllers from
# ../controllers/<name> (shared) or ./controllers-staging/<name>/
# (staging-specific) as the apps you opt into staging actually need
# them.
#
# Currently shipping:
#   - cert-manager   — shared with production (../controllers/cert-manager).
#                      Pairs with infrastructure/configs/cert-manager/staging/
#                      which adds the LE-staging ClusterIssuer + the
#                      *.staging.mainertoo.com wildcard Certificate.
#                      Its ServiceMonitor is patched off below — staging
#                      has no kube-prometheus-stack, so the CRD is absent.
#   - traefik-proxy  — staging-specific (./traefik-proxy/). Uses
#                      the staging wildcard cert; no Authentik
#                      middleware, no PVE file provider.
#   - ceph-csi-rbd   — RBD CSI driver via the shared, cluster-agnostic
#                      manifests (../controllers/ceph-csi-base +
#                      ceph-csi-rbd; same Ceph cluster as production). The
#                      StorageClass is staging-specific (./storage/ceph-rbd/)
#                      and points at the dedicated, quota'd `staging-rbd`
#                      pool through a cephx user scoped to that pool only —
#                      isolated from production's k3s-rbd.
#   - kyverno        — shared with production (../controllers/kyverno), same
#                      chart and version; patched below to 1 replica per
#                      controller, no PDBs, no ServiceMonitors. Rehearsal
#                      target for the ClusterPolicy -> CEL migration
#                      (docs/plans/kyverno-cel-migration.md), together with:
#   - volsync-crds   — VolSync CRDs only (./volsync-crds/), NO controller,
#                      so generated RS/RD stay inert.
#   - kyverno-rehearsal — pvc-plumber stub + dummy volsync-kopia-shared-base
#                      + scratch namespace (./kyverno-rehearsal/).
#
# Deliberately NOT in staging yet (add later when needed):
#   - newt           — pangolin tunnel client for external access at
#                      *.staging.mainertoo.com. Needs a fresh pangolin
#                      client registration; follow-up PR once you have
#                      the secret.
#   - cephfs / snapshot-controller / volsync (controller) / cnpg /
#     cloudflared / tailscale-operator / intel-gpu / pvc-plumber /
#     kube-prometheus-stack / etc.
resources:
  - ../controllers/cert-manager
  - ./traefik-proxy
  # Ceph RBD storage — shared driver manifests + staging-only StorageClass.
  - ../controllers/ceph-csi-base
  - ../controllers/ceph-csi-rbd
  - ./storage/ceph-rbd
  # Kyverno CEL migration rehearsal (docs/plans/kyverno-cel-migration.md).
  - ../controllers/kyverno
  - ./volsync-crds
  - ./kyverno-rehearsal
  # The CEL policies under test (plan phase 1). Staging has no backup-labelled
  # PVCs outside the kyverno-rehearsal namespace, so nothing else is affected.
  - ../controllers/kyverno/policies-cel

patches:
  # The shared cert-manager release enables a ServiceMonitor (#600) for
  # production's Prometheus. Staging has no monitoring.coreos.com CRDs, so
  # rendering it failed every Helm upgrade and pinned staging at v1.20.2.
  - target:
      kind: HelmRelease
      name: cert-manager
    patch: |
      - op: replace
        path: /spec/values/prometheus/servicemonitor/enabled
        value: false
  # Kyverno on staging: same chart/version as production, sized down.
  # Staging has no Prometheus Operator CRDs (ServiceMonitors would fail the
  # Helm render) and a single replica can't satisfy a minAvailable:1 PDB
  # during drains.
  - target:
      kind: HelmRelease
      name: kyverno
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: kyverno
      spec:
        values:
          admissionController:
            replicas: 1
            podDisruptionBudget:
              enabled: false
            serviceMonitor:
              enabled: false
          backgroundController:
            replicas: 1
            podDisruptionBudget:
              enabled: false
            serviceMonitor:
              enabled: false
          cleanupController:
            replicas: 1
            podDisruptionBudget:
              enabled: false
            serviceMonitor:
              enabled: false
          reportsController:
            replicas: 1
            podDisruptionBudget:
              enabled: false
            serviceMonitor:
              enabled: false
