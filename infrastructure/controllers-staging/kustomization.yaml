apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Bare-minimum controller set for the staging cluster. Staging is a
# testbed, not a clone — add specific controllers from
# ../controllers/<name> (shared) or ./controllers-staging/<name>/
# (staging-specific) as the apps you opt into staging actually need
# them.
#
# Currently shipping:
#   - cert-manager   — shared with production (../controllers/cert-manager).
#                      Pairs with infrastructure/configs/cert-manager/staging/
#                      which adds the LE-staging ClusterIssuer + the
#                      *.staging.mainertoo.com wildcard Certificate.
#                      Its ServiceMonitor is patched off below — staging
#                      has no kube-prometheus-stack, so the CRD is absent.
#   - traefik-proxy  — staging-specific (./traefik-proxy/). Uses
#                      the staging wildcard cert; no Authentik
#                      middleware, no PVE file provider.
#   - ceph-csi-rbd   — RBD CSI driver via the shared, cluster-agnostic
#                      manifests (../controllers/ceph-csi-base +
#                      ceph-csi-rbd; same Ceph cluster as production). The
#                      StorageClass is staging-specific (./storage/ceph-rbd/)
#                      and points at the dedicated, quota'd `staging-rbd`
#                      pool through a cephx user scoped to that pool only —
#                      isolated from production's k3s-rbd.
#   - kyverno        — shared with production (../controllers/kyverno), same
#                      chart and version; patched below to 1 replica per
#                      controller, no PDBs, no ServiceMonitors. Controller
#                      only, no policies: it stays as the upgrade canary for
#                      production's Kyverno until production retires it with
#                      the VolSync backup policies. (Until 2026-11-27 staging
#                      also ran VolSync, the backup policies and a
#                      pvc-plumber stub, first for the Kyverno CEL rehearsal
#                      and then for the VolSync -> kopiur adoption test; see
#                      the wiki page backup-and-recovery/kopiur-migration.)
#   - snapshot-controller — shared with production
#                      (../controllers/snapshot-controller), patched below
#                      to 1 replica, no PDB. Production's two
#                      VolumeSnapshotClasses are removed from this build;
#                      staging's own live in
#                      infrastructure/configs/storage/staging (Flux
#                      Kustomization infra-storage-config).
#   - kopiur         — shared (../controllers/kopiur). Kopia backup
#                      operator, on staging first as the replacement for
#                      VolSync + pvc-plumber + the Kyverno backup policies.
#   - ceph-csi-cephfs — shared driver (../controllers/ceph-csi-cephfs),
#                      staging StorageClasses in ./storage/cephfs/. Same
#                      filesystem as production (k3s-fs) but its own
#                      subvolume group `staging` (100 GiB quota) and its own
#                      journal namespace, set by the ceph-csi-config patch
#                      below. cephx user client.k3s-staging-cephfs is
#                      limited to /volumes/staging.
#
# Deliberately NOT in staging yet (add later when needed):
#   - newt           — pangolin tunnel client for external access at
#                      *.staging.mainertoo.com. Needs a fresh pangolin
#                      client registration; follow-up PR once you have
#                      the secret.
#   - volsync / pvc-plumber / the Kyverno backup policies: replaced by
#     kopiur on staging.
#   - cnpg / cloudflared / tailscale-operator / intel-gpu /
#     kube-prometheus-stack / etc.
resources:
  - ../controllers/cert-manager
  - ./traefik-proxy
  # Ceph RBD storage — shared driver manifests + staging-only StorageClass.
  - ../controllers/ceph-csi-base
  - ../controllers/ceph-csi-rbd
  - ./storage/ceph-rbd
  # CephFS - shared driver manifests + staging-only StorageClasses.
  - ../controllers/ceph-csi-cephfs
  - ./storage/cephfs
  # CSI snapshots + the kopiur backup operator (staging first).
  - ../controllers/snapshot-controller
  - ../controllers/kopiur
  # Kyverno controller only (upgrade canary for production).
  - ../controllers/kyverno

patches:
  # The shared cert-manager release enables a ServiceMonitor (#600) for
  # production's Prometheus. Staging has no monitoring.coreos.com CRDs, so
  # rendering it failed every Helm upgrade and pinned staging at v1.20.2.
  - target:
      kind: HelmRelease
      name: cert-manager
    patch: |
      - op: replace
        path: /spec/values/prometheus/servicemonitor/enabled
        value: false
  # ceph-csi cluster config for staging: CephFS volumes go to the `staging`
  # subvolume group and keep their journal in the `staging` RADOS namespace
  # of the metadata pool, apart from production's (group `csi`, default
  # namespace). RBD is unaffected: it is separated by pool. Both names are
  # fixed once volumes exist; changing them orphans those volumes.
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ceph-csi-config
        namespace: ceph-csi
      data:
        config.json: |-
          [
            {
              "clusterID": "2b142655-7791-4f14-8934-0ea16121b652",
              "monitors": [
                "192.168.99.12:6789",
                "192.168.99.13:6789",
                "192.168.99.14:6789"
              ],
              "cephFS": {
                "kernelMountOptions": "recover_session=clean",
                "subvolumeGroup": "staging",
                "radosNamespace": "staging"
              }
            }
          ]
  # snapshot-controller on staging: one replica, so no PDB (a single replica
  # cannot satisfy minAvailable: 1 during a drain).
  - target:
      kind: HelmRelease
      name: snapshot-controller
    patch: |
      - op: replace
        path: /spec/values/controller/replicaCount
        value: 1
  - patch: |
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: snapshot-controller
        namespace: snapshot-controller-system
  # Production's snapshot classes point at production's pool and filesystem.
  # Staging's are applied by infra-storage-config, after the CRDs exist.
  - patch: |
      $patch: delete
      apiVersion: snapshot.storage.k8s.io/v1
      kind: VolumeSnapshotClass
      metadata:
        name: ceph-rbd-snapclass
  - patch: |
      $patch: delete
      apiVersion: snapshot.storage.k8s.io/v1
      kind: VolumeSnapshotClass
      metadata:
        name: cephfs-snapclass
  # Kyverno on staging: same chart/version as production, sized down.
  # Staging has no Prometheus Operator CRDs (ServiceMonitors would fail the
  # Helm render) and a single replica can't satisfy a minAvailable:1 PDB
  # during drains.
  - target:
      kind: HelmRelease
      name: kyverno
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: kyverno
      spec:
        values:
          admissionController:
            replicas: 1
            podDisruptionBudget:
              enabled: false
            serviceMonitor:
              enabled: false
          backgroundController:
            replicas: 1
            podDisruptionBudget:
              enabled: false
            serviceMonitor:
              enabled: false
          cleanupController:
            replicas: 1
            podDisruptionBudget:
              enabled: false
            serviceMonitor:
              enabled: false
          reportsController:
            replicas: 1
            podDisruptionBudget:
              enabled: false
            serviceMonitor:
              enabled: false
