apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Bare-minimum controller set for the staging cluster. Staging is a
# testbed, not a clone — add specific controllers from
# ../controllers/<name> (shared) or ./controllers-staging/<name>/
# (staging-specific) as the apps you opt into staging actually need
# them.
#
# Currently shipping:
#   - cert-manager   — shared with production (../controllers/cert-manager).
#                      Pairs with infrastructure/configs/cert-manager/staging/
#                      which adds the LE-staging ClusterIssuer + the
#                      *.staging.mainertoo.com wildcard Certificate.
#                      Its ServiceMonitor is patched off below — staging
#                      has no kube-prometheus-stack, so the CRD is absent.
#   - traefik-proxy  — staging-specific (./traefik-proxy/). Uses
#                      the staging wildcard cert; no Authentik
#                      middleware, no PVE file provider.
#   - ceph-csi-rbd   — RBD CSI driver via the shared, cluster-agnostic
#                      manifests (../controllers/ceph-csi-base +
#                      ceph-csi-rbd; same Ceph cluster as production). The
#                      StorageClass is staging-specific (./storage/ceph-rbd/)
#                      and points at the dedicated, quota'd `staging-rbd`
#                      pool through a cephx user scoped to that pool only —
#                      isolated from production's k3s-rbd.
#   - kyverno        — shared with production (../controllers/kyverno), same
#                      chart and version; patched below to 1 replica per
#                      controller, no PDBs, no ServiceMonitors. Rehearsal
#                      target for the ClusterPolicy -> CEL migration
#                      (docs/plans/kyverno-cel-migration.md), together with:
#   - volsync        — shared with production (../controllers/volsync/app):
#                      the same chart and fork image, added 2026-11-26 to
#                      test adopting VolSync backups into kopiur. Before that
#                      staging had the CRDs only. Production's ServiceMonitor,
#                      KopiaMaintenance and maintenance Secret are removed
#                      below; staging's own KopiaMaintenance lives with the
#                      test app (apps/base/volsync-test). The backup policy
#                      is patched below to write to the staging-only Garage
#                      bucket volsync-staging.
#   - kyverno-rehearsal — pvc-plumber stub + volsync-kopia-shared-base
#                      (staging bucket credentials) + scratch namespace
#                      (./kyverno-rehearsal/).
#   - snapshot-controller — shared with production
#                      (../controllers/snapshot-controller), patched below
#                      to 1 replica, no PDB. Production's two
#                      VolumeSnapshotClasses are removed from this build;
#                      staging's own live in
#                      infrastructure/configs/storage/staging (Flux
#                      Kustomization infra-storage-config).
#   - kopiur         — shared (../controllers/kopiur). Kopia backup
#                      operator, on staging first as the replacement for
#                      VolSync + pvc-plumber + the Kyverno backup policies.
#   - ceph-csi-cephfs — shared driver (../controllers/ceph-csi-cephfs),
#                      staging StorageClasses in ./storage/cephfs/. Same
#                      filesystem as production (k3s-fs) but its own
#                      subvolume group `staging` (100 GiB quota) and its own
#                      journal namespace, set by the ceph-csi-config patch
#                      below. cephx user client.k3s-staging-cephfs is
#                      limited to /volumes/staging.
#
# Deliberately NOT in staging yet (add later when needed):
#   - newt           — pangolin tunnel client for external access at
#                      *.staging.mainertoo.com. Needs a fresh pangolin
#                      client registration; follow-up PR once you have
#                      the secret.
#   - cnpg / cloudflared / tailscale-operator / intel-gpu / pvc-plumber
#     (staging runs a stub) / kube-prometheus-stack / etc.
resources:
  - ../controllers/cert-manager
  - ./traefik-proxy
  # Ceph RBD storage — shared driver manifests + staging-only StorageClass.
  - ../controllers/ceph-csi-base
  - ../controllers/ceph-csi-rbd
  - ./storage/ceph-rbd
  # CephFS - shared driver manifests + staging-only StorageClasses.
  - ../controllers/ceph-csi-cephfs
  - ./storage/cephfs
  # CSI snapshots + the kopiur backup operator (staging first).
  - ../controllers/snapshot-controller
  - ../controllers/kopiur
  # Kyverno CEL migration rehearsal (docs/plans/kyverno-cel-migration.md).
  - ../controllers/kyverno
  - ../controllers/volsync/app
  - ./kyverno-rehearsal
  # Same VolSync policies as production (legacy backup ClusterPolicy + CEL
  # engine gate + CEL jitter + RBAC), the baseline for rehearsing the Kyverno
  # 1.20 cutover. The only backup-labelled PVCs on staging are the two in
  # the volsync-test namespace (apps/base/volsync-test).
  - ../controllers/kyverno/policies

patches:
  # The shared cert-manager release enables a ServiceMonitor (#600) for
  # production's Prometheus. Staging has no monitoring.coreos.com CRDs, so
  # rendering it failed every Helm upgrade and pinned staging at v1.20.2.
  - target:
      kind: HelmRelease
      name: cert-manager
    patch: |
      - op: replace
        path: /spec/values/prometheus/servicemonitor/enabled
        value: false
  # ceph-csi cluster config for staging: CephFS volumes go to the `staging`
  # subvolume group and keep their journal in the `staging` RADOS namespace
  # of the metadata pool, apart from production's (group `csi`, default
  # namespace). RBD is unaffected: it is separated by pool. Both names are
  # fixed once volumes exist; changing them orphans those volumes.
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ceph-csi-config
        namespace: ceph-csi
      data:
        config.json: |-
          [
            {
              "clusterID": "2b142655-7791-4f14-8934-0ea16121b652",
              "monitors": [
                "192.168.99.12:6789",
                "192.168.99.13:6789",
                "192.168.99.14:6789"
              ],
              "cephFS": {
                "kernelMountOptions": "recover_session=clean",
                "subvolumeGroup": "staging",
                "radosNamespace": "staging"
              }
            }
          ]
  # snapshot-controller on staging: one replica, so no PDB (a single replica
  # cannot satisfy minAvailable: 1 during a drain).
  - target:
      kind: HelmRelease
      name: snapshot-controller
    patch: |
      - op: replace
        path: /spec/values/controller/replicaCount
        value: 1
  - patch: |
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: snapshot-controller
        namespace: snapshot-controller-system
  # Production's snapshot classes point at production's pool and filesystem.
  # Staging's are applied by infra-storage-config, after the CRDs exist.
  - patch: |
      $patch: delete
      apiVersion: snapshot.storage.k8s.io/v1
      kind: VolumeSnapshotClass
      metadata:
        name: ceph-rbd-snapclass
  - patch: |
      $patch: delete
      apiVersion: snapshot.storage.k8s.io/v1
      kind: VolumeSnapshotClass
      metadata:
        name: cephfs-snapclass
  # VolSync on staging. Production's ServiceMonitor needs Prometheus CRDs
  # staging does not have. Its KopiaMaintenance and maintenance Secret point
  # at production's bucket with production's credentials, so neither may
  # exist here.
  - patch: |
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: volsync-monitor
        namespace: volsync-system
  - patch: |
      $patch: delete
      apiVersion: volsync.backube/v1alpha1
      kind: KopiaMaintenance
      metadata:
        name: volsync-kopia-shared
        namespace: volsync-system
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: volsync-kopia-maintenance
        namespace: volsync-system
  # The backup policy hardcodes production's Garage endpoint and bucket in
  # the per-PVC Secret it generates. On staging the same Secret points at the
  # staging-only bucket volsync-staging, reached on the QNAP's S3 port
  # directly (no TLS), like the kopiur repository. KOPIA_REPOSITORY is left
  # exactly as in production on purpose: the fork takes the bucket from
  # KOPIA_S3_BUCKET and only reads a prefix from the URL, and kopiur's
  # translator must be tested against that same odd value. Everything else
  # in this expression is a copy of generate[0] in
  # ../controllers/kyverno/policies-cel/volsync-pvc-backup-objects.yaml;
  # keep the two in step.
  - target:
      kind: GeneratingPolicy
      name: volsync-pvc-backup-objects
    patch: |
      - op: replace
        path: /spec/generate/0/expression
        value: >-
          generator.Apply(variables.ns, [
            {
              "apiVersion": dyn("v1"),
              "kind": dyn("Secret"),
              "metadata": dyn({"name": "volsync-" + variables.pvc, "namespace": variables.ns}),
              "type": dyn("Opaque"),
              "data": dyn({
                "KOPIA_REPOSITORY": base64.encode(bytes("s3://garage.lab.mainertoo.com")),
                "KOPIA_PASSWORD": variables.shared.data.KOPIA_PASSWORD,
                "AWS_ACCESS_KEY_ID": variables.shared.data.AWS_ACCESS_KEY_ID,
                "AWS_SECRET_ACCESS_KEY": variables.shared.data.AWS_SECRET_ACCESS_KEY,
                "KOPIA_S3_ENDPOINT": base64.encode(bytes("192.168.1.252:3900")),
                "KOPIA_S3_BUCKET": base64.encode(bytes("volsync-staging")),
                "KOPIA_S3_DISABLE_TLS": base64.encode(bytes("true")),
                "AWS_DEFAULT_REGION": base64.encode(bytes("us-west-1")),
                "AWS_REGION": base64.encode(bytes("us-west-1")),
                "AWS_EC2_METADATA_DISABLED": base64.encode(bytes("true"))
              })
            }
          ])
  # Kyverno on staging: same chart/version as production, sized down.
  # Staging has no Prometheus Operator CRDs (ServiceMonitors would fail the
  # Helm render) and a single replica can't satisfy a minAvailable:1 PDB
  # during drains.
  - target:
      kind: HelmRelease
      name: kyverno
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: kyverno
      spec:
        values:
          admissionController:
            replicas: 1
            podDisruptionBudget:
              enabled: false
            serviceMonitor:
              enabled: false
          backgroundController:
            replicas: 1
            podDisruptionBudget:
              enabled: false
            serviceMonitor:
              enabled: false
          cleanupController:
            replicas: 1
            podDisruptionBudget:
              enabled: false
            serviceMonitor:
              enabled: false
          reportsController:
            replicas: 1
            podDisruptionBudget:
              enabled: false
            serviceMonitor:
              enabled: false
