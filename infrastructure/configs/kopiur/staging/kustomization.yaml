apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# kopiur repository for staging (Flux Kustomization infra-kopiur-config,
# dependsOn infra-controllers, wait: true). Separate from the operator so a
# fresh cluster does not try to apply a ClusterRepository before its CRD
# exists, and so apps can dependsOn "the repository is Ready".
resources:
  - kopiur-repository-secret.sops.yaml
  - clusterrepository.yaml
