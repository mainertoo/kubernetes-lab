# The Kopia repository VolSync writes on staging (bucket volsync-staging),
# attached as it is: create.enabled false, so kopiur can connect to it but
# never initialise it. Rehearsal for attaching production's volsync-kopia
# bucket. The credentials are a copy of flux-system/volsync-kopia-shared-base.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: volsync
spec:
  backend:
    s3:
      bucket: volsync-staging
      endpoint: 192.168.1.252:3900
      region: us-west-1
      tls:
        disableTls: true
      auth:
        secretRef:
          name: kopiur-volsync-repository
          namespace: kopiur-system
  encryption:
    passwordSecretRef:
      name: kopiur-volsync-repository
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  create:
    enabled: false
  allowedNamespaces:
    all: true
  credentialProjection:
    allowed: true
  catalog:
    # Snapshots whose identity matches no namespace on this cluster are
    # listed here.
    fallbackNamespace: kopiur-system
  maintenance:
    namespace: kopiur-system
    # Off while VolSync's KopiaMaintenance still runs. takeoverPolicy: Never
    # was not enough: on first connect kopiur 0.11.2 claimed maintenance
    # ownership from maintenance@volsync and ran a full maintenance, and
    # VolSync claimed it back on its next run (2026-11-27). Two tools must
    # not both run maintenance on one repository. Turned on again when the
    # KopiaMaintenance is removed.
    enabled: false
    takeoverPolicy: Never
