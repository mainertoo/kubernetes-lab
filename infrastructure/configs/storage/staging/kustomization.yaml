apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Storage objects that need CRDs installed by a controller (Flux
# Kustomization infra-storage-config, dependsOn infra-controllers).
# They are kept out of infra-controllers on purpose: a VolumeSnapshotClass
# in the same Flux Kustomization as the snapshot-controller HelmRelease
# fails the server-side dry-run on a fresh cluster (CRD not there yet), and
# a failed dry-run applies nothing, so the HelmRelease is never created.
resources:
  - volumesnapshotclass-ceph-rbd.yaml
