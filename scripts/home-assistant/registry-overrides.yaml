# registry-overrides.yaml — desired state for the Home Assistant registry.
#
# WHY THIS EXISTS: HA has no YAML for the entity/device registry. Names, aliases,
# device_class overrides, hidden flags, areas and Assist exposure all live in
# /config/.storage, which HA owns and rewrites at runtime — so a bare-metal
# restore brings template entities back from git and loses every override.
# `homeassistant.customize` is legacy and only covers friendly_name/icon/
# device_class; it cannot express aliases, exposure, hidden or areas.
#
#   ./ha-registry.py check    # diff only, exit 1 if drifted (safe, read-only)
#   ./ha-registry.py apply    # converge the live registry onto this file
#   ./ha-registry.py export <entity_id>...   # seed new blocks from live state
#
# Devices are matched by MAC because device_ids are regenerated when a device is
# removed and re-added. Entities are matched by entity_id, which is pinned by the
# template's unique_id — never change a unique_id.
#
# This does NOT create entities. Template entities come from
# apps/base/home-assistant/home-assistant-templates.yaml via Flux; integration
# entities appear when their device is added. This only decorates them.

devices:
  - comment: Sliding Door Lock 1 (kitchen)
    mac: "e4:b0:63:75:7d:a8"
    area: kitchen
  - comment: Sliding Door Lock 2 (dining room)
    mac: "cc:ba:97:c2:1c:b8"
    area: dining_room
  - comment: Sliding Door Lock 3 (family room)
    mac: "d8:85:ac:f3:92:54"
    area: family_room
    name_by_user: Sliding Door Lock 3
  - comment: Sliding Door Lock 4 (loft)
    mac: "cc:ba:97:c2:44:20"
    area: loft
    name_by_user: Sliding Door Lock 4
  # ⚠️ HA had this one as "Master Bedroom Slider Lock" in area Master Bedroom, which
  # made every entity_id carry the room twice. Renamed before provisioning; the
  # entity_id renames themselves are NOT expressible here (config PVC / kopia only).
  - comment: Sliding Door Lock 5 (master bedroom) — the last of the five
    mac: "cc:ba:97:c1:1d:f0"
    area: master_bedroom
    name_by_user: Sliding Door Lock 5
  # Entity IDs were renamed shellyofficegen4/shellyplugusg4_* -> 3d_printer_plug_*
  # (2026-09-12). This file cannot express entity_id renames — those survive via the
  # kopia-backed config PVC, not a bare rebuild.
  - comment: 3D Printer Plug (office) — Shelly Plug US Gen4 feeding the QIDI Max 4 power bar
    mac: "ac:eb:e6:f7:48:ac"
    area: office_bedroom
    name_by_user: 3D Printer Plug

# ── Sliding door locks ───────────────────────────────────────────────────────
# ⚠️ Names are place-based, never numbered: Assist drops a trailing number and
# will answer about the wrong door. See wiki 278.
# ⚠️ The relays report intent, not bolt state — hidden and never exposed.
entities:
  binary_sensor.dining_room_sliding_door_lock_2_input_100:
    device_class: door
    expose: true
    name: Dining Room Sliding Door Position
  binary_sensor.family_room_sliding_door_lock_3_input_100:
    device_class: door
    expose: true
    name: Family Room Sliding Door Position
  binary_sensor.kitchen_sliding_door_lock_1_input_100:
    device_class: door
    expose: true
    name: Kitchen Sliding Door Position
  binary_sensor.loft_sliding_door_lock_4_input_100:
    device_class: door
    expose: true
    name: Loft Sliding Door Position
  binary_sensor.master_bedroom_sliding_door_lock_5_input_100:
    device_class: door
    expose: true
    name: Master Bedroom Sliding Door Position
  binary_sensor.sliding_door_1_lock_armed:
    area_id: kitchen
    expose: false
    name: Kitchen Sliding Door Lock Armed
  binary_sensor.sliding_door_2_lock_armed:
    area_id: dining_room
    expose: false
    name: Dining Room Sliding Door Lock Armed
  # Door 3's template entities were created with place-based names already, so no
  # name override is needed — unlike doors 1/2, which were renamed after registration.
  binary_sensor.sliding_door_3_lock_armed:
    area_id: family_room
    expose: false
  binary_sensor.sliding_door_4_lock_armed:
    area_id: loft
    expose: false
  binary_sensor.sliding_door_5_lock_armed:
    area_id: master_bedroom
    expose: false
  # ── QIDI Max 4 ───────────────────────────────────────────────────────────────
  # Not a second webcam: Moonraker exposes the slicer's plate render for the job in
  # progress as a camera entity. It serves a real PNG while printing and HTTP 500s
  # whenever nothing is, so left visible it sat broken on the auto-generated Summary
  # dashboard's Security view 24/7. Hidden here and placed on the 3D Printer
  # dashboard instead, with a visibility condition. Hiding does not disable it.
  camera.qidi_max_4_thumbnail:
    expose: false
    hidden_by: user
    name: QIDI Max 4 Plate Preview
  event.family_room_sliding_door_lock_3_input:
    expose: false
  event.loft_sliding_door_lock_4_input:
    expose: false
  event.master_bedroom_sliding_door_lock_5_input:
    expose: false
  lock.sliding_door_1:
    aliases:
    - kitchen door
    - kitchen slider
    - patio door
    area_id: kitchen
    expose: true
    name: Kitchen Sliding Door
  lock.sliding_door_2:
    aliases:
    - dining room door
    - dining room slider
    area_id: dining_room
    expose: true
    name: Dining Room Sliding Door
  lock.sliding_door_3:
    aliases:
    - family room door
    - family room slider
    area_id: family_room
    expose: true
  lock.sliding_door_4:
    aliases:
    - loft door
    - loft slider
    area_id: loft
    expose: true
  lock.sliding_door_5:
    aliases:
    - bedroom slider
    - master bedroom door
    - master bedroom slider
    area_id: master_bedroom
    expose: true
  # ── 3D printer plug ──────────────────────────────────────────────────────────
  # ⚠️ Turning this off kills a print mid-job — never exposed to Assist.
  switch.3d_printer_plug:
    expose: false
  switch.dining_room_sliding_door_lock_2:
    expose: false
    hidden_by: user
    icon: mdi:electric-switch
    name: Sliding Door Lock 2 Relay
  switch.family_room_sliding_door_lock_3:
    expose: false
    hidden_by: user
    icon: mdi:electric-switch
    name: Sliding Door Lock 3 Relay
  switch.kitchen_sliding_door_lock_1:
    expose: false
    hidden_by: user
    icon: mdi:electric-switch
    name: Sliding Door Lock 1 Relay
  switch.loft_sliding_door_lock_4:
    expose: false
    hidden_by: user
    icon: mdi:electric-switch
    name: Sliding Door Lock 4 Relay
  switch.master_bedroom_sliding_door_lock_5:
    expose: false
    hidden_by: user
    icon: mdi:electric-switch
    name: Sliding Door Lock 5 Relay

