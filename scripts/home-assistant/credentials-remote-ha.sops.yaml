# Home Assistant — remote family instance (administered from here, hosted elsewhere).
#
# Separate from credentials.sops.yaml (the lab HA at home), same shape — so anything
# reading HASS_URL/HASS_TOKEN works against either. Use the wrapper:
#
#     ./ha-remote ./hass.py ping
#     ./ha-remote curl -sS "$HASS_URL/api/config" -H "Authorization: Bearer $HASS_TOKEN"
#
# The URL lives in stringData (encrypted) ON PURPOSE — this repo is public and the
# address points at someone else's house. Don't copy it into README/docs/commit messages.
#
# Token = HA Long-Lived Access Token, created on that instance under YOUR admin user:
# profile → Security → Long-Lived Access Tokens → Create Token.
# It never expires and carries that user's full rights — treat it like a root password.
#
# ⚠️ THIS REPO IS PUBLIC. VS Code auto-encrypts *.sops.yaml on save. After pasting the
# token, VERIFY before committing:
#     grep -q 'ENC\[' scripts/home-assistant/credentials-remote-ha.sops.yaml && echo encrypted
